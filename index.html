<!DOCTYPE html>
<html lang="ru" data-sheet="full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Искра</title>
  <meta name="description" content="Маленькие рубли. Большие цели." />
  <meta name="theme-color" content="#0c0712" />
  <meta name="color-scheme" content="dark light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Искра" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" /></noscript>
  <style>
    :root {
      --bg: #0c0712;
      --surface: #16101f;
      --surface-2: #1e1629;
      --fg: #f3efe8;
      --muted: #9a9088;
      --subtle: #6e675f;
      --accent: #ff7a2e;
      --accent-fg: #1a0c04;
      --glow: #3aa0ff;
      --ok: #86c28a;
      --warn: #e0a35c;
      --danger: #e07070;
      --border: rgb(243 239 232 / 0.12);
      --glass: rgb(12 7 18 / .72);
      --card-bg: rgb(12 7 18 / .4);
      --overlay: rgb(12 7 18 / .62);
      --stage: #0c0712;
      --font: "Manrope", ui-sans-serif, system-ui, sans-serif;
      --display: "Unbounded", "Manrope", ui-sans-serif, system-ui, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --panel: 0 0 0 1px rgb(243 239 232 / 0.08), 0 18px 50px -24px rgb(0 0 0 / 0.7);
    }
    html[data-theme="light"] {
      --bg: #f3efe8;
      --surface: #fffaf4;
      --surface-2: #ece6dc;
      --fg: #1c1410;
      --muted: #6e645c;
      --subtle: #8a8078;
      --accent: #e05612;
      --accent-fg: #fff8f2;
      --glow: #1d6fbf;
      --ok: #2f7a48;
      --warn: #a86a20;
      --danger: #c04545;
      --border: rgb(28 20 16 / 0.12);
      --glass: rgb(255 250 244 / .84);
      --card-bg: rgb(28 20 16 / .05);
      --overlay: rgb(28 20 16 / .45);
      --stage: #efe8dc;
      --panel: 0 0 0 1px rgb(28 20 16 / 0.08), 0 18px 40px -24px rgb(80 50 20 / 0.22);
    }
    * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: rgb(243 239 232 / 0.18) transparent; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overscroll-behavior: none; }
    body { overflow: hidden; -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; touch-action: manipulation; }
    button:disabled { opacity: .4; pointer-events: none; }
    h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
    p { margin: 0; text-wrap: pretty; }
    .tabular { font-variant-numeric: tabular-nums; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; cursor: pointer; }
    #shapeTag {
      position: fixed; z-index: 2; pointer-events: none;
      font-family: var(--display); font-size: 11px; letter-spacing: .28em;
      text-transform: uppercase; color: var(--muted);
      left: 62%; top: 86%; transform: translateX(-50%);
      text-shadow: 0 8px 28px rgb(12 7 18 / .8);
    }
    .peek { height: 34svh; flex-shrink: 0; pointer-events: auto; cursor: pointer; transition: height 0.4s var(--ease); }
    #vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at 62% 45%, transparent 0%, rgb(12 7 18 / .12) 50%, rgb(12 7 18 / .78) 100%);
    }
    #boot {
      position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: var(--bg);
    }
    #boot .kicker { font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
    #boot h1 { font-size: clamp(2.4rem, 6vw, 3.4rem); margin-top: 12px; }
    #boot .line { margin-top: 28px; height: 1px; width: 64px; background: rgb(243 239 232 / .1); overflow: hidden; border-radius: 99px; }
    #boot .line i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); }
    .shell { position: relative; z-index: 2; height: 100dvh; display: flex; flex-direction: column; pointer-events: none; }
    .topbar {
      pointer-events: auto; display: flex; align-items: center; justify-content: space-between;
      padding: max(10px, env(safe-area-inset-top)) 16px 8px;
    }
    .brand {
      background: var(--glass); backdrop-filter: blur(16px); box-shadow: var(--panel);
      border-radius: 20px; padding: 8px 14px;
    }
    .brand b { font-family: var(--display); font-size: 16px; font-weight: 500; display: block; line-height: 1; }
    .brand span { font-size: 11px; color: var(--muted); }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
      background: var(--glass); backdrop-filter: blur(16px); box-shadow: var(--panel); color: var(--fg);
    }
    .icon-btn:active { transform: scale(.96); }
    .sheet {
      pointer-events: auto; flex: 1; min-height: 0; display: flex; flex-direction: column;
      background: linear-gradient(to bottom, color-mix(in srgb, var(--surface) 82%, transparent) 0, var(--surface) 4.5rem);
      border-radius: 28px 28px 0 0; box-shadow: var(--panel); overflow: hidden;
    }
    .handle { height: 28px; display: grid; place-items: center; flex-shrink: 0; cursor: pointer; touch-action: none; }
    .handle i { width: 40px; height: 4px; border-radius: 99px; background: rgb(243 239 232 / .28); transition: width 0.25s var(--ease); }
    .remain { padding: 0 16px 10px; flex-shrink: 0; }
    .remain .row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
    .remain label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .remain strong { font-family: var(--display); font-size: 24px; font-weight: 500; }
    .bar { height: 6px; border-radius: 99px; background: rgb(243 239 232 / .1); overflow: hidden; margin-top: 8px; }
    .bar > i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: 0 50%; border-radius: 99px; }
    #view { flex: 1; min-height: 0; overflow: auto; padding: 4px 16px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
    .dock {
      flex-shrink: 0; padding: 8px 12px max(8px, env(safe-area-inset-bottom));
      background: var(--surface); box-shadow: 0 -1px 0 rgb(243 239 232 / .08);
    }
    .cta {
      width: 100%; height: 48px; border-radius: 14px; background: var(--accent); color: var(--accent-fg);
      font-weight: 600; font-size: 14px; margin-bottom: 6px;
    }
    .cta:active, .btn:active, .chip:active { transform: scale(.96); }
    .cta.ghost, .btn.ghost { background: transparent; color: var(--fg); }
    .cta.sec, .btn.sec { background: var(--surface-2); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
    nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
    nav.tabs button {
      min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; color: var(--muted); border-radius: 12px; font-size: 11px; font-weight: 500;
    }
    nav.tabs button.on { color: var(--accent); background: rgb(255 122 46 / .12); }
    nav.tabs svg { width: 20px; height: 20px; }
    .card { background: var(--card-bg); border-radius: 16px; padding: 12px 14px; }
    .card.accent { background: rgb(255 122 46 / .12); box-shadow: inset 0 0 0 1px rgb(243 239 232 / .1); }
    .kicker { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); } .subtle { color: var(--subtle); } .ok { color: var(--ok); } .warn { color: var(--warn); } .danger { color: var(--danger); } .glow { color: var(--glow); }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mini { background: var(--card-bg); border-radius: 16px; padding: 10px 12px; }
    .mini .kicker { font-size: 10px; display: flex; gap: 6px; align-items: center; color: var(--subtle); }
    .mini b { display: block; font-family: var(--display); font-size: 18px; font-weight: 500; margin-top: 4px; }
    .mini span { font-size: 11px; color: var(--muted); }
    .goal { text-align: left; width: 100%; border-radius: 18px; padding: 14px 12px; background: var(--card-bg); min-height: 56px; }
    .goal.on { background: rgb(255 122 46 / .12); box-shadow: inset 0 0 0 1px rgb(243 239 232 / .1); }
    .goal .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .btn {
      height: 48px; border-radius: 14px; padding: 0 16px; font-weight: 600; font-size: 14px;
      background: var(--accent); color: var(--accent-fg); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn.sm { height: 44px; }
    .btn.danger { background: rgb(224 112 112 / .15); color: var(--danger); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .field input, .field select, .field textarea {
      height: 48px; border-radius: 12px; border: 0; background: var(--bg); color: var(--fg);
      padding: 0 12px; box-shadow: inset 0 0 0 1px var(--border); outline: none; width: 100%;
    }
    .field textarea { height: 88px; padding: 12px; resize: none; }
    .field input:focus, .field select:focus, .field textarea:focus { box-shadow: inset 0 0 0 2px var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { min-height: 44px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--surface-2); font-size: 13px; box-shadow: inset 0 0 0 1px var(--border); }
    .chip.on { background: rgb(255 122 46 / .16); color: var(--accent); box-shadow: none; }
    .overlay {
      position: fixed; inset: 0; z-index: 40; background: var(--overlay);
      display: none; align-items: flex-end; justify-content: center; padding: 12px;
    }
    .overlay.show { display: flex; }
    .modal {
      width: min(420px, 100%); max-height: min(86dvh, 720px); overflow: auto;
      background: var(--surface); border-radius: 28px; padding: 22px 18px 18px; box-shadow: var(--panel);
    }
    .toast {
      position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top)); transform: translateX(-50%) translateY(-120%);
      z-index: 60; background: var(--surface); color: var(--fg); border-radius: 14px; padding: 12px 16px;
      box-shadow: var(--panel); font-size: 14px; display: flex; gap: 12px; align-items: center; max-width: 92vw;
    }
    .onboard {
      pointer-events: auto; margin: auto 12px max(12px, env(safe-area-inset-bottom));
      width: min(520px, calc(100% - 24px)); max-height: min(78dvh, 42rem); overflow: auto;
      background: var(--glass); backdrop-filter: blur(18px); box-shadow: var(--panel);
      border-radius: 28px; padding: 28px 22px;
    }
    .hero-next { text-align: left; width: 100%; }
    .tx { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--card-bg); border-radius: 12px; padding: 8px 10px; font-size: 12px; }
    .slots { display: flex; gap: 6px; margin-top: 10px; }
    .slots i { flex: 1; height: 6px; border-radius: 99px; background: rgb(243 239 232 / .1); overflow: hidden; }
    .slots i b { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; }
    .psy-card { width: 100%; text-align: left; }
    .psy-card .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .badge { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); background: rgb(255 122 46 / .14); border-radius: 99px; padding: 3px 8px; }
    @media (min-width: 1024px) {
      .shell { display: block; }
      .peek { display: none; }
      .sheet {
        position: absolute; left: 16px; top: 88px; bottom: 16px; width: 22.5rem;
        border-radius: 28px; background: var(--glass); backdrop-filter: blur(16px);
      }
      .handle { display: none; }
      .dock { background: transparent; box-shadow: none; }
      nav.tabs { display: flex; gap: 4px; background: var(--card-bg); padding: 4px; border-radius: 14px; margin-top: 4px; }
      nav.tabs button { flex: 1; min-height: 36px; flex-direction: row; font-size: 12px; }
      nav.tabs button.on { background: var(--accent); color: var(--accent-fg); }
      nav.tabs svg { display: none; }
      .cta { display: none; }
      .topbar { position: absolute; inset: 0 0 auto 0; padding: 16px; }
      .topbar .fund-top { display: inline-flex !important; height: 44px; padding: 0 16px; border-radius: 14px; }
      #vignette { display: block; }
      #shapeTag { left: 62%; top: 82%; }
      .onboard { margin: auto auto auto 24px; }
      .overlay { align-items: center; }
    }
    @media (max-width: 1023px) {
      .topbar {
        position: absolute; left: 0; right: 0; top: 0; z-index: 3;
      }
      .topbar .fund-top { display: none !important; }
      .chip { min-height: 48px; height: 48px; }
      .icon-btn { width: 48px; height: 48px; }
      .peek { height: 26svh; }
      html[data-sheet="full"] .peek { height: 11svh; }
      html[data-sheet="full"] .handle i { width: 28px; }
      .sheet { min-height: 0; }
      #vignette { background: linear-gradient(to bottom, color-mix(in srgb, var(--bg) 15%, transparent), transparent 18%, transparent 22%, color-mix(in srgb, var(--bg) 50%, transparent) 22%); }
      #shapeTag { left: 50%; top: 16svh; transition: top 0.4s var(--ease); }
      html[data-sheet="full"] #shapeTag { top: 7svh; }
    }
    .is-hidden { display: none !important; }
    .pay-lines { list-style: none; padding: 0; margin: 10px 0 0; }
    .pay-lines li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 8px 0; font-size: 14px; box-shadow: 0 1px 0 var(--border); }
    .pay-lines li:last-child { box-shadow: none; }
    .payday .btn { width: 100%; margin-top: 12px; }
    .file-btn { position: relative; overflow: hidden; }
    html[data-theme="light"] #vignette { opacity: .55; }
    html[data-theme="light"] #shapeTag { text-shadow: 0 8px 28px rgb(243 239 232 / .8); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>
  <div id="vignette"></div>
  <div id="shapeTag">Искра</div>
  <div id="boot" role="status"><p class="kicker">Накопления</p><h1>Искра</h1><div class="line"><i></i></div></div>
  <div class="shell is-hidden" id="shell">
    <header class="topbar">
      <div class="brand"><b>Искра</b><span id="brandSub">Накопления без пафоса</span></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn fund-top" type="button" data-act="fund">Пополнить</button>
        <button class="icon-btn" type="button" data-act="settings" aria-label="Настройки">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>
    <div class="peek"></div>
    <section class="sheet">
      <div class="handle" role="button" tabindex="0" aria-label="Развернуть панель" aria-expanded="true"><i></i></div>
      <div class="remain" id="remain"></div>
      <div id="view"></div>
      <div class="dock">
        <button class="cta" type="button" data-act="fund" id="dockFund">Пополнить</button>
        <nav class="tabs" id="tabs"></nav>
      </div>
    </section>
  </div>
  <div id="onboardWrap" class="is-hidden"></div>
  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <input type="file" id="importFile" accept="application/json" hidden />

        <p class="muted" style="font-size:13px;margin-bottom:16px">Хватит приблизительно. Свободные ${formatRub(Math.max(0, free))} — топливо искр.</p>
        <div class="stack">
          <div class="field"><label>Доход в месяц</label><input id="ob-in" inputmode="decimal" value="${profile.monthlyIncome || ""}" /></div>
          <div class="field"><label>Расходы в месяц</label><input id="ob-out" inputmode="decimal" value="${profile.monthlyExpenses || ""}" /></div>

  function renderRemain() {
    const active = goals.filter((g) => !g.archived);
    const t = totals(active);
    $("#remain").innerHTML = `<div class="row"><label>Осталось до целей</label><strong class="tabular">${formatRub(t.remaining, true)}</strong></div>
      <div class="bar"><i style="transform:scaleX(${t.progress})"></i></div>`;
    $("#brandSub").textContent = `${profile.name ? profile.name + " · " : ""}${formatPct(t.progress)} пути`;
    const want = shapeForProgress(t.progress);
    if (profile.onboarded) morphTo(want, 1.8);
  }

  function renderTabs() {
    $("#tabs").innerHTML = TABS.map((t) => `<button type="button" data-tab="${t.id}" class="${tab === t.id ? "on" : ""}">
      ${t.id === "overview" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>' : ""}
      ${t.id === "goals" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>' : ""}
      ${t.id === "plan" ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>' : ""}

  function viewPayday(active) {
    const st = paydayState();
    const alloc = planAllocation(profile, active);
    if (st.done) {
      return `<div class="card">
        <p class="kicker">Себе уже заплатили</p>
        <p class="muted" style="margin-top:8px;font-size:13px;line-height:1.45">Расклад этого месяца записан. Следующий — после ${st.day}-го.</p>
      </div>`;
    }
    if (!st.due || !alloc.items.length) return "";
    return `<div class="card accent payday">
      <p class="kicker">${esc(st.kicker)}</p>
      <h3 style="margin-top:8px;font-size:18px">Сначала себе</h3>
      <p class="muted" style="margin-top:8px;font-size:13px;line-height:1.45">Свободных ${formatRub(st.free)}. Пока они на карте — разложите по смыслу.</p>
      <ul class="pay-lines">${alloc.items.map((it) => `<li><span>${esc(it.name)}</span><span class="tabular">${formatRub(it.amount)}</span></li>`).join("")}</ul>
      ${alloc.buffer > 0 ? `<p class="subtle" style="font-size:12px;margin-top:8px">Воздух ${formatRub(alloc.buffer)} не трогаем</p>` : ""}
      <button class="btn" type="button" data-act="payday-go">Записать расклад</button>
      <div class="chips" style="margin-top:10px">
        <button type="button" class="chip" data-act="quick-in" data-amount="1000">+1 тыс.</button>
        <button type="button" class="chip" data-act="quick-in" data-amount="5000">+5 тыс.</button>
        <button type="button" class="chip" data-act="quick-in" data-amount="10000">+10 тыс.</button>
        <button type="button" class="chip" data-act="payday-later">Не сейчас</button>
      </div>
    </div>`;
  }

  function viewOverview() {
    const active = goals.filter((g) => !g.archived);
    const free = freeCash(profile);
    const rate = savingsRate(profile);
    const em = emergencyCoverage(active, profile);
    const move = nextMove(profile, active);
    const psy = buildPsy(profile, active, txs);
    const st = paydayState();
    const now = new Date();
    const buckets = [];
    for (let i = 7; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      buckets.push({ key, v: 0 });
    }
    const map = Object.fromEntries(buckets.map((b) => [b.key, b]));
    txs.forEach((x) => { if (x.kind === "in" && map[x.date.slice(0, 7)]) map[x.date.slice(0, 7)].v += x.amount; });
    const max = Math.max(1, ...buckets.map((b) => b.v));
    const w = 280, h = 72;
    const pts = buckets.map((b, i) => `${(i / 7) * w},${h - (b.v / max) * (h - 8) - 4}`).join(" ");
    const pay = viewPayday(active);
    return `<div class="stack" id="vroot">
      ${pay}
      ${st.due ? "" : `<button class="card accent hero-next" type="button" data-act="move">
        <p class="kicker">${esc(monthTitle())}</p>
        <h3 style="margin-top:8px;font-size:18px">${esc(move.title)}</h3>
        ${move.amount > 0 ? `<p class="tabular" style="font-family:var(--display);font-size:26px;margin-top:6px">${formatRub(move.amount)}</p>` : ""}
        <p class="muted" style="font-size:12px;margin-top:8px;line-height:1.45">${esc(move.body)}</p>
      </button>`}
      <div class="grid2">
        <div class="mini"><p class="kicker">Норма</p><b class="tabular">${formatPct(rate)}</b><span>${free >= 0 ? "от дохода" : "расходы выше прихода"}</span></div>
        <div class="mini"><p class="kicker">Подушка</p><b class="tabular">${em.months.toFixed(1)} мес</b><span>${formatRub(em.saved, true)}</span></div>
      </div>
      <div class="card">
        <p class="kicker" style="margin-bottom:8px">Взносы</p>
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="72" preserveAspectRatio="none">
          <polyline fill="none" stroke="var(--accent)" stroke-width="1.8" points="${pts}" />
        </svg>
      </div>
      <button class="card hero-next" type="button" data-tab="mind">
        <p class="kicker">Психология денег · ${esc(psy.temperamentLabel)}</p>
        <p style="margin-top:8px;font-size:14px;line-height:1.5">${psy.portrait}</p>
        <p class="glow" style="margin-top:8px;font-size:12px">Читать полностью</p>
      </button>
      <button type="button" class="subtle" style="font-size:12px;text-align:left" data-act="settings">Доход ${formatRub(profile.monthlyIncome)} · расходы ${formatRub(profile.monthlyExpenses)} · свободно ${formatRub(free)}</button>
    </div>`;
  }

  function viewGoals() {
    const active = goals.filter((g) => !g.archived);
    const sel = active.find((g) => g.id === selectedId) ?? active[0];
    if (sel && mobileDetail && innerWidth < 1024) return viewGoal(sel, true);
    return `<div class="stack">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <p class="kicker">Цели</p>
        <button class="btn ghost sm" type="button" data-act="new-goal">+ Новая</button>
      </div>
      ${active.length === 0 ? `<p class="muted" style="font-size:14px">Пока пусто. Назовите сумму и срок — созвездие соберётся.</p>` : ""}
      ${active.map((g) => {
        const p = progressOf(g.saved, g.target);
        return `<button class="goal ${g.id === sel?.id ? "on" : ""}" type="button" data-goal="${g.id}">
          <div class="top"><span>${esc(g.name)}</span><span class="subtle" style="font-size:11px">${CAT[g.category]?.label || ""}</span></div>
          <div class="bar" style="margin-top:8px"><i style="background:var(--glow);transform:scaleX(${p})"></i></div>
          <p class="muted tabular" style="font-size:12px;margin-top:8px">${formatRub(g.saved, true)} из ${formatRub(g.target, true)}</p>
        </button>`;
      }).join("")}
    </div>`;
  }

  function viewGoal(g, back) {
    const rem = remainingOf(g.saved, g.target);
    const p = progressOf(g.saved, g.target);
    const months = monthsUntil(g.deadline);
    const req = requiredMonthly(rem, months);
    const list = txs.filter((x) => x.goalId === g.id).slice(0, 10);
    return `<div class="stack">
      ${back ? `<button class="btn ghost sm" type="button" data-act="goals-back">← К целям</button>` : ""}
      <p class="kicker">${CAT[g.category]?.label || ""}</p>
      <h2>${esc(g.name)}</h2>
      ${g.note ? `<p class="muted" style="font-size:13px">${esc(g.note)}</p>` : ""}
      <p class="tabular" style="font-family:var(--display);font-size:28px">${formatRub(rem || g.saved)}</p>
      <p class="muted" style="font-size:13px">${rem <= 0 ? "цель собрана" : "осталось до цели"}</p>
      <div class="bar"><i style="transform:scaleX(${p})"></i></div>
      <div class="grid2">
        <div class="mini"><p class="kicker">Срок</p><b style="font-size:14px">${g.deadline ? formatMonths(Math.max(0, months ?? 0)) : "не задан"}</b></div>
        <div class="mini"><p class="kicker">Взнос / мес</p><b style="font-size:14px">${rem <= 0 ? "—" : formatRub(req, true)}</b></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" style="flex:1" data-act="fund" data-goal="${g.id}">Взнос</button>
        <button class="btn sec" style="flex:1" data-act="withdraw" data-goal="${g.id}">Снять</button>
      </div>
      <p class="kicker">Движение</p>
      ${list.length === 0 ? `<p class="subtle" style="font-size:13px">Пока нет записей</p>` : list.map((x) => `<div class="tx"><span class="muted">${formatDate(x.date)}${x.note ? " · " + esc(x.note) : ""}</span><span class="${x.kind === "in" ? "ok" : "danger"} tabular">${x.kind === "in" ? "+" : "−"}${num0.format(x.amount)} ₽</span></div>`).join("")}
      <div style="display:flex;gap:8px">
        <button class="btn ghost sm" style="flex:1" data-act="edit-goal" data-goal="${g.id}">Изменить</button>
        <button class="btn danger sm" data-act="del-goal" data-goal="${g.id}">Удалить</button>
      </div>
    </div>`;
  }

  function viewPlan() {
    const active = goals.filter((g) => !g.archived);
    const alloc = planAllocation(profile, active);
    const free = freeCash(profile);
    const key = todayISO().slice(0, 7);
    const planDone = txs.some((x) => x.kind === "in" && x.note === "План месяца" && x.date.startsWith(key));
    return `<div class="stack">
      <p class="kicker">Расклад зарплаты</p>
      <p class="muted" style="font-size:13px">${free <= 0 ? "Свободных нет — сначала режем расход." : `${formatRub(alloc.buffer)} оставляем как воздух, остальное — по приоритету.`}</p>
      ${alloc.items.map((it) => `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(it.name)}</span><span class="tabular">${formatRub(it.amount)}</span></div><p class="muted" style="font-size:12px;margin-top:6px">${esc(it.reason)}</p></div>`).join("")}
      ${alloc.items.length ? `<button class="btn" data-act="apply-plan">${planDone ? "Записать ещё раз" : "Записать как взносы"}</button>` : ""}
      ${alloc.leftover > 10 ? `<p class="muted" style="font-size:12px">Ещё ${formatRub(alloc.leftover)} не разобрали.</p>` : ""}
      <p class="kicker" style="margin-top:8px">Правило 50 / 30 / 20</p>
      <p class="muted" style="font-size:12px">Ориентир, не догма. Для небольшой зарплаты важнее 10% себе.</p>
      <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
        <div class="mini"><p class="kicker">Нужды</p><b style="font-size:13px">${formatRub(profile.monthlyIncome * 0.5, true)}</b><span>факт ${formatRub(profile.monthlyExpenses, true)}</span></div>
        <div class="mini"><p class="kicker">Желания</p><b style="font-size:13px">${formatRub(profile.monthlyIncome * 0.3, true)}</b></div>
        <div class="mini"><p class="kicker">Себе</p><b style="font-size:13px">${formatRub(profile.monthlyIncome * 0.2, true)}</b></div>
      </div>
    </div>`;
  }

  function viewMind() {
    const active = goals.filter((g) => !g.archived);
    const psy = buildPsy(profile, active, txs);
    const want = Math.max(1, Math.min(6, Math.round(psy.cushionWant)));
    const open = ui.openPsy || psy.cards[0]?.id || "";
    const slots = Array.from({ length: want }, (_, i) => {
      const fill = clamp(psy.cushionMonths - i, 0, 1);
      return `<i><b style="transform:scaleX(${fill})"></b></i>`;
    }).join("");
    return `<div class="stack">
      <div>
        <p class="kicker" style="display:flex;gap:8px;align-items:center">Психология денег <span class="badge">${esc(psy.temperamentLabel)}</span></p>
        <h2 style="margin-top:8px;font-size:20px">Ваши цифры, ваш характер</h2>
        <p class="muted" style="margin-top:8px;font-size:14px;line-height:1.5">${psy.portrait}</p>
      </div>
      <div class="card">
        <p class="kicker">Куплено спокойствия</p>
        <p class="tabular" style="font-family:var(--display);font-size:26px;margin-top:6px">${lifeMonths(psy.cushionMonths)}</p>
        <p class="muted" style="font-size:11px">из ${psy.cushionWant} мес. · на счетах ${lifeMonths(psy.freedomMonths)}</p>
        <div class="slots">${slots}</div>
        ${psy.quietWealth > 0 ? `<p class="muted" style="font-size:12px;margin-top:10px;line-height:1.45">Тихий капитал ${formatRub(psy.quietWealth)} — то, что вы не купили.</p>` : ""}
      </div>
      <div class="card accent">
        <p class="kicker">Эссе</p>
        <h3 style="margin-top:8px">${esc(psy.essay.title)}</h3>
        <p class="muted" style="margin-top:8px;font-size:14px;line-height:1.5">${psy.essay.body}</p>
      </div>
      <p class="kicker">Ловушки и опоры</p>
      ${psy.cards.map((c) => `<div class="card">
        <button type="button" class="psy-card" data-psy="${c.id}">
          <div class="head">
            <div><p class="kicker" style="color:var(--subtle)">${esc(c.kicker)}</p><h3 style="font-size:14px;margin-top:4px">${c.title}</h3></div>
            ${c.figure ? `<div style="text-align:right"><p class="tabular" style="font-family:var(--display);font-size:14px">${esc(c.figure)}</p>${c.hint ? `<p class="subtle" style="font-size:10px">${esc(c.hint)}</p>` : ""}</div>` : ""}
          </div>
        </button>
        ${open === c.id ? `<p class="muted" style="font-size:12px;line-height:1.5;margin-top:8px">${c.body}</p>${c.action !== "none" && c.actionLabel ? `<button class="btn sec sm" style="width:100%;margin-top:10px" data-psyact="${c.action}" data-goal="${c.goalId || ""}" data-amount="${c.amount || 0}">${esc(c.actionLabel)}</button>` : ""}` : ""}
      </div>`).join("")}
    </div>`;
  }

  function renderApp() {
    $("#onboardWrap").classList.add("is-hidden");
    $("#shell").classList.remove("is-hidden");
    $("#onboardWrap").hidden = true;
    $("#shell").hidden = false;
    renderRemain();
    renderTabs();
    const active = goals.filter((g) => !g.archived);
    const sel = active.find((g) => g.id === selectedId) ?? active[0];
    $("#dockFund").disabled = active.length === 0;
    let html = "";
    if (tab === "overview") html = viewOverview();
    else if (tab === "goals") html = sel && mobileDetail ? viewGoal(sel, true) : viewGoals();
    else if (tab === "plan") html = viewPlan();
    else html = viewMind();
    $("#view").innerHTML = html;
    introView();
  }

  function fundModal(kind, goalId, amount) {
    const active = goals.filter((g) => !g.archived);
    const gid = goalId || selectedId || active[0]?.id;
    const g = active.find((x) => x.id === gid) || active[0];
    if (!g) return toast("Сначала заведите цель");
    const alloc = planAllocation(profile, active);
    const plan = Object.fromEntries(alloc.items.map((i) => [i.goalId, i.amount]));
    const remaining = remainingOf(g.saved, g.target);
    const presets = kind === "in" ? amountPresets(remaining, plan[g.id]) : amountPresets(g.saved).filter((p) => p.label !== "По плану");
    const start = amount || 0;
    openModal(`<h2>${kind === "in" ? "Пополнить" : "Снять"}</h2>
      <p class="muted" style="font-size:13px;margin:8px 0 14px">${kind === "in" ? "Сумма сразу сядет на цель." : "Снять можно не больше, чем лежит."}</p>
      <div class="chips" id="fg">${active.map((x) => `<button type="button" class="chip ${x.id === g.id ? "on" : ""}" data-fg="${x.id}">${esc(x.name)}</button>`).join("")}</div>
      <div class="chips" style="margin-top:10px">
        <button type="button" class="chip ${kind === "in" ? "on" : ""}" data-kind="in">Взнос</button>
        <button type="button" class="chip ${kind === "out" ? "on" : ""}" data-kind="out">Снятие</button>
      </div>
      <div class="field" style="margin-top:12px"><label>Сумма</label><input id="fa" inputmode="decimal" value="${start || ""}" /></div>
      <div class="chips" id="fp" style="margin-top:8px">${presets.map((p) => `<button type="button" class="chip" data-pv="${p.value}">${esc(p.label)}</button>`).join("")}</div>
      <div class="field" style="margin-top:12px"><label>Комментарий</label><input id="fn" placeholder="Зарплата, кешбэк…" /></div>
      <button class="btn" style="width:100%;margin-top:16px" id="fs">${kind === "in" ? "Записать взнос" : "Записать снятие"}</button>
      <button class="btn ghost" style="width:100%;margin-top:6px" data-act="close">Закрыть</button>`, () => {
      let curG = g.id, curK = kind;
      const refresh = () => {};
      $("#fg")?.addEventListener("click", (e) => {
        const id = e.target.dataset.fg; if (!id) return;
        curG = id;
        $$chips("#fg");
        e.target.classList.add("on");
      });
      $("#modal").addEventListener("click", (e) => {
        if (e.target.dataset.kind) {
          curK = e.target.dataset.kind;
          $("#modal").querySelectorAll("[data-kind]").forEach((b) => b.classList.toggle("on", b.dataset.kind === curK));
          $("#fs").textContent = curK === "in" ? "Записать взнос" : "Записать снятие";
        }
        if (e.target.dataset.pv) $("#fa").value = e.target.dataset.pv;
      });
      $("#fs").onclick = () => {
        const amt = parseRub($("#fa").value);
        const ok = addTx(curG, amt, curK, $("#fn").value, todayISO());
        if (!ok) return toast(curK === "out" ? "Снимать больше, чем лежит, нельзя" : "Не получилось");
        closeModal();
        emitBurst();
        buzz();
        toast(curK === "in" ? "Взнос записан" : "Снятие записано");
        renderApp();
        animateRemain();
      };
      function $$chips(sel) { $("#modal").querySelectorAll(sel + " .chip").forEach((b) => b.classList.remove("on")); }
    });
  }

  function goalModal(edit) {
    const g = edit || { name: "", category: "emergency", target: 0, saved: 0, deadline: "", note: "" };
    openModal(`<h2>${edit ? "Изменить цель" : "Новая цель"}</h2>
      <p class="muted" style="font-size:13px;margin:8px 0 14px">Сумма, срок и зачем — без этого рубли разбегаются.</p>
      <div class="stack">
        <div class="field"><label>Название</label><input id="gn" value="${esc(g.name)}" /></div>

        <div class="field"><label>Зачем</label><textarea id="gnote">${esc(g.note || "")}</textarea></div>
      </div>
      <button class="btn" style="width:100%;margin-top:16px" id="gsave">Сохранить</button>
      <button class="btn ghost" style="width:100%;margin-top:6px" data-act="close">Закрыть</button>`, () => {
      $("#gsave").onclick = () => {
        const name = $("#gn").value.trim() || "Без названия";
        const category = $("#gc").value;
        const target = Math.max(0, parseRub($("#gt").value));
        const deadline = $("#gd").value || null;
        const note = $("#gnote").value.trim();
        if (edit) {
          goals = goals.map((x) => x.id === edit.id ? { ...x, name, category, target, deadline, note } : x);
          toast("Цель обновлена");
        } else {
          const saved = Math.max(0, parseRub($("#gs")?.value || 0));
          const id = uid();
          goals = [{ id, name, category, target, saved, deadline, createdAt: todayISO(), note, archived: false }, ...goals];
          selectedId = id; tab = "goals";
          if (saved > 0) addTx(id, saved, "in", "Стартовый остаток", todayISO());
          toast("Цель добавлена");
        }
        persist(); closeModal(); renderApp();
      };
    });
  }

  function settingsModal() {
    const mode = themeMode();
    const day = clamp(profile.paydayDay || 10, 1, 28);
    const days = Array.from({ length: 28 }, (_, i) => i + 1);
    openModal(`<h2>Настройки</h2>
      <p class="muted" style="font-size:13px;margin:8px 0 14px">Цифры живут только на этом устройстве.</p>
      <div class="stack">
        <div class="field"><label>Имя</label><input id="sn" value="${esc(profile.name)}" /></div>
        <div class="field"><label>Доход / мес</label><input id="si" inputmode="decimal" value="${profile.monthlyIncome || ""}" /></div>
        <div class="field"><label>Расходы / мес</label><input id="so" inputmode="decimal" value="${profile.monthlyExpenses || ""}" /></div>
        <div class="field"><label>Подушка, месяцев</label><input id="se" inputmode="numeric" value="${profile.emergencyMonths}" /></div>
        <div class="field"><label>День зарплаты</label>
          <select id="sp">${days.map((d) => `<option value="${d}" ${d === day ? "selected" : ""}>${d}-е число</option>`).join("")}</select>
        </div>
        <div class="field"><label>Тема</label>
          <select id="sth">
            <option value="dark" ${mode === "dark" ? "selected" : ""}>Тёмная</option>
            <option value="light" ${mode === "light" ? "selected" : ""}>Светлая</option>
            <option value="system" ${mode === "system" ? "selected" : ""}>Как в системе</option>
          </select>
        </div>
      </div>
      <button class="btn" style="width:100%;margin-top:16px" id="ss">Сохранить</button>
      <button class="btn sec" style="width:100%;margin-top:8px" data-act="export">Скачать копию</button>
      <button class="btn sec" style="width:100%;margin-top:6px" data-act="import">Восстановить из файла</button>
      <p class="subtle" style="font-size:12px;margin-top:14px;line-height:1.45">На экран Домой: в Safari — Поделиться → На экран «Домой». В Chrome — меню → Установить приложение.</p>
      <button class="btn ghost" style="width:100%;margin-top:10px" data-act="demo">Загрузить пример</button>
      <button class="btn ghost" style="width:100%;margin-top:6px" data-act="reset">Сбросить всё</button>
      <button class="btn ghost" style="width:100%;margin-top:6px" data-act="close">Закрыть</button>`, () => {
      $("#ss").onclick = () => {
        profile = {
          ...profile,
          name: $("#sn").value.trim(),
          monthlyIncome: parseRub($("#si").value),
          monthlyExpenses: parseRub($("#so").value),
          emergencyMonths: Math.max(1, parseRub($("#se").value) || 3),
          paydayDay: clamp(parseRub($("#sp").value) || 10, 1, 28),
        };
        applyTheme($("#sth").value);
        persist(); closeModal(); toast("Сохранено"); renderApp();
      };
    });
  }

  function confirmModal(title, body, label, run, danger) {
    openModal(`<h2>${esc(title)}</h2><p class="muted" style="margin:10px 0 16px;font-size:14px">${esc(body)}</p>
      <button class="btn ${danger ? "danger" : ""}" style="width:100%" id="ok">${esc(label)}</button>
      <button class="btn ghost" style="width:100%;margin-top:6px" data-act="close">Отмена</button>`, () => {
      $("#ok").onclick = () => { run(); closeModal(); };
    });
  }

  document.body.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act],[data-tab],[data-onb],[data-goal],[data-psy],[data-psyact]");
    if (e.target.id === "overlay") closeModal();
    if (!t) return;
    const act = t.dataset.act, onb = t.dataset.onb;
    if (t.dataset.tab) {
      tab = t.dataset.tab; mobileDetail = false;
      if (tab !== "mind") ui.openPsy = "";
      renderApp(); return;
    }
    if (t.dataset.goal && !act) {
      selectedId = t.dataset.goal; mobileDetail = true; tab = "goals"; renderApp(); return;
    }
    if (t.dataset.psy) { ui.openPsy = ui.openPsy === t.dataset.psy ? "" : t.dataset.psy; renderApp(); return; }
    if (t.dataset.psyact) {
      const a = t.dataset.psyact;
      if (a === "fund") fundModal("in", t.dataset.goal, Number(t.dataset.amount) || 0);
      else if (a === "plan") { tab = "plan"; renderApp(); }
      else if (a === "payday") recordPlan();
      else if (a === "settings") settingsModal();
      else if (a === "goal") goalModal(null);
      return;
    }
    if (onb === "1") {
      renderOnboard(1); return;
    }
    if (onb === "2") {
      profile.name = $("#ob-name")?.value.trim() || "";
      renderOnboard(2); return;
    }
    if (onb === "3") {
      profile.monthlyIncome = parseRub($("#ob-in")?.value);
      profile.monthlyExpenses = parseRub($("#ob-out")?.value);
      renderOnboard(3); return;
    }
    if (onb === "go") {
      const name = $("#ob-gn")?.value.trim() || "Подушка";
      const target = parseRub($("#ob-gt")?.value) || profile.monthlyExpenses * 3;
      const id = uid();
      if (target > 0) {
        goals = [{ id, name, category: "emergency", target, saved: 0, deadline: null, createdAt: todayISO(), note: "", archived: false }];
        selectedId = id;
      }
      profile.onboarded = true;
      persist();
      renderApp();
      if (window.gsap) gsap.fromTo("#shell", { opacity: 0 }, { opacity: 1, duration: 0.45 });
      return;
    }
    if (act === "demo") {
      loadDemo(); closeModal(); renderApp();
      emitBurst(); toast("Пример Анны загружен");
      if (window.gsap) gsap.fromTo("#shell", { opacity: 0 }, { opacity: 1, duration: 0.4 });
      return;
    }
    if (act === "fund") fundModal("in", t.dataset.goal, 0);
    if (act === "withdraw") fundModal("out", t.dataset.goal || selectedId, 0);
    if (act === "settings") settingsModal();
    if (act === "close") closeModal();
    if (act === "new-goal") goalModal(null);
    if (act === "edit-goal") {
      const g = goals.find((x) => x.id === t.dataset.goal); if (g) goalModal(g);
    }
    if (act === "del-goal") {
      const g = goals.find((x) => x.id === t.dataset.goal);
      if (!g) return;
      confirmModal(`Удалить «${g.name}»?`, "Цель и взносы пропадут с этого устройства.", "Удалить", () => {
        goals = goals.filter((x) => x.id !== g.id);
        txs = txs.filter((x) => x.goalId !== g.id);
        selectedId = goals[0]?.id ?? null;
        mobileDetail = false; persist(); renderApp(); toast("Цель удалена");
      }, true);
    }
    if (act === "goals-back") { mobileDetail = false; renderApp(); }
    if (act === "move") {
      const move = nextMove(profile, goals.filter((g) => !g.archived));
      if (move.kind === "setup" || move.kind === "cut") settingsModal();
      else if (move.kind === "goal") goalModal(null);
      else fundModal("in", move.goalId, move.amount);
    }
    if (act === "apply-plan") {
      const alloc = planAllocation(profile, goals.filter((g) => !g.archived));
      if (!alloc.items.length) return toast("Раскладывать нечего");
      const lines = alloc.items.map((i) => `${i.name}: ${formatRub(i.amount)}`).join(". ");
      confirmModal("Записать расклад месяца", `${lines}. Суммы лягут как взносы за сегодня.`, "Записать", () => {
        recordPlan();
      });
    }
    if (act === "payday-go") { recordPlan(); return; }
    if (act === "payday-later") { ui.paydayHide = true; renderApp(); return; }
    if (act === "quick-in") {
      const amt = Number(t.dataset.amount);
      const move = nextMove(profile, goals.filter((g) => !g.archived));
      if (!move.goalId || !amt) return toast("Сначала заведите цель");
      const g = goals.find((x) => x.id === move.goalId);
      if (!addTx(move.goalId, amt, "in", "Быстрый взнос")) return toast("Не получилось");
      emitBurst(); buzz(); renderApp(); animateRemain();
      toast(`+${formatRub(amt)} на «${g?.name || "цель"}»`);
      return;
    }
    if (act === "export") {
      const payload = JSON.stringify({ state: { version: 1, profile, goals, txs }, version: 0 }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `iskra-${todayISO()}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 800);
      toast("Копия скачана");
      return;
    }
    if (act === "import") {
      $("#importFile")?.click();
      return;
    }
    if (act === "reset") {
      confirmModal("Сбросить Искру?", "Все цели и взносы на этом устройстве исчезнут.", "Сбросить", () => {
        profile = defaultProfile(); goals = []; txs = []; selectedId = null; persist();
        renderOnboard(0); toast("Очищено");
      }, true);
    }
  });

  $("#importFile")?.addEventListener("change", (e) => {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result || ""));
        const s = data.state && data.state.profile ? data.state : data;
        if (!s.profile || typeof s.profile !== "object") throw new Error("no profile");
        profile = { ...defaultProfile(), ...s.profile, onboarded: true };
        goals = Array.isArray(s.goals) ? s.goals : [];
        txs = Array.isArray(s.txs) ? s.txs : [];
        selectedId = goals[0]?.id ?? null;
        persist();
        closeModal();
        renderApp();
        toast("Данные восстановлены");
      } catch {
        toast("Этот файл Искра не узнала");
      }
    };
    reader.readAsText(file);
  });

  (function bindSheet() {
    const handle = document.querySelector(".handle");
    if (!handle) return;
    const apply = (mode) => {
      const next = mode === "mid" ? "mid" : "full";
      document.documentElement.dataset.sheet = next;
      handle.setAttribute("aria-expanded", next === "full" ? "true" : "false");
      handle.setAttribute("aria-label", next === "full" ? "Свернуть панель" : "Развернуть панель");
      try { localStorage.setItem("iskra-sheet", next); } catch {}
    };
    try {
      apply(localStorage.getItem("iskra-sheet") === "mid" ? "mid" : "full");
    } catch {
      apply("full");
    }
    let y0 = 0, armed = false;
    const finish = (y) => {
      if (innerWidth >= 1024) return;
      const dy = y - y0;
      if (Math.abs(dy) < 28) apply(document.documentElement.dataset.sheet === "full" ? "mid" : "full");
      else apply(dy < 0 ? "full" : "mid");
      if (typeof buzz === "function") buzz(8);
    };
    handle.addEventListener("pointerdown", (e) => {
      if (innerWidth >= 1024) return;
      armed = true;
      y0 = e.clientY;
      try { handle.setPointerCapture(e.pointerId); } catch {}
    });
    handle.addEventListener("pointerup", (e) => {
      if (!armed) return;
      armed = false;
      finish(e.clientY);
    });
    handle.addEventListener("keydown", (e) => {
      if (innerWidth >= 1024) return;
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        apply(document.documentElement.dataset.sheet === "full" ? "mid" : "full");
      }
    });
  })();

  (function bindSwipe() {
    let sx = 0, sy = 0, tracking = false;
    const view = () => $("#view");
    document.addEventListener("touchstart", (e) => {
      if (ui.modal) return;
      if (!$("#shell") || $("#shell").classList.contains("is-hidden")) return;
      if (e.target.closest("input, textarea, select, button, .modal, .handle")) return;
      const t = e.changedTouches[0];
      sx = t.clientX; sy = t.clientY; tracking = true;
    }, { passive: true });
    document.addEventListener("touchend", (e) => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) < 72 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      if (mobileDetail && tab === "goals" && dx > 0) {
        mobileDetail = false; buzz(8); renderApp(); return;
      }
      const ids = TABS.map((x) => x.id);
      const i = ids.indexOf(tab);
      if (dx < 0 && i < ids.length - 1) { tab = ids[i + 1]; mobileDetail = false; }
      else if (dx > 0 && i > 0) { tab = ids[i - 1]; mobileDetail = false; }
      else return;
      if (tab !== "mind") ui.openPsy = "";
      buzz(8);
      renderApp();
    }, { passive: true });
    view();
  })();

  let startedUI = false;
  function go() {
    if (startedUI) return;
    startedUI = true;
    window.__GO = true;
    try {
      if (profile.onboarded) renderApp();
      else renderOnboard(0);
    } catch (err) {
      console.error(err);
      try { renderOnboard(0); } catch (e2) { console.error(e2); }
    }
    const boot = $("#boot");
    if (boot) {
      boot.style.pointerEvents = "none";
      if (window.gsap) {
        gsap.to(boot, { opacity: 0, duration: 0.35, ease: "power2.in", onComplete: () => boot.remove() });
      } else {
        boot.style.opacity = "0";
        setTimeout(() => boot.remove(), 400);
      }
    }
  }

  function start() {
    window.__START = true;
    applyTheme();
    window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
      if (themeMode() === "system") applyTheme("system");
    });
    hydrate();
    try { bootStage(); } catch (err) { console.error(err); }
    go();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }

  if (window.gsap) start();
  else {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js";
    s.onload = start;
    s.onerror = start;
    document.head.appendChild(s);
  }
})();
  </script>
</body>
</html>
