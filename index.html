  <style>
    :root {
      --ios-bg: #F2F2F7;
      --ios-text: #000000;
      --ios-text-secondary: #3C3C43;
      --ios-text-tertiary: #8E8E93;
      --ios-accent: #007AFF;
      --ios-green: #34C759;
      --ios-green-bg: rgba(52, 199, 89, 0.1);
      --ios-separator: rgba(60, 60, 67, 0.12);
      --ios-fill-tertiary: rgba(118, 118, 128, 0.08);
      --ios-glass-border: rgba(255, 255, 255, 0.5);
      --ios-radius-sm: 12px;
      --ios-radius-md: 16px;
      --ios-radius-lg: 20px;
      --ios-radius-xl: 24px;
      --ios-font-large-title: 34px;
      --ios-font-title2: 22px;
      --ios-font-body: 17px;
      --ios-font-callout: 16px;
      --ios-font-footnote: 13px;
      --ios-font-caption: 12px;
      --transition-spring: 0.4s cubic-bezier(0.22, 0.6, 0.36, 1);
      --transition-ease: 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, 'Inter', BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(135deg, #E8E9F0 0%, #F2F2F7 30%, #EAECF2 70%, #E0E2EB 100%);
      color: var(--ios-text);
      line-height: 1.47059;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      min-height: 100dvh;
      font-size: var(--ios-font-body);
      letter-spacing: -0.022em;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      max-width: 428px;
      margin: 0 auto;
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(242, 242, 247, 0.78);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      padding: 12px 16px 8px;
      border-bottom: 0.5px solid var(--ios-separator);
      touch-action: pan-x;
    }

    .navbar-title {
      font-size: var(--ios-font-large-title);
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--ios-text);
      margin-bottom: 6px;
      line-height: 1.1;
    }

    .navbar-subtitle {
      font-size: var(--ios-font-footnote);
      font-weight: 500;
      background: var(--ios-green-bg);
      color: #1C7A32;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .week-selector {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .week-selector::-webkit-scrollbar {
      display: none;
    }

    .week-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      background: var(--ios-fill-tertiary);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      font-family: inherit;
      font-size: var(--ios-font-callout);
      font-weight: 500;
      color: var(--ios-text);
      cursor: pointer;
      transition: all var(--transition-ease);
      white-space: nowrap;
      letter-spacing: -0.01em;
      scroll-snap-align: start;
      height: 36px;
      display: flex;
      align-items: center;
    }

    .week-btn.active {
      background: var(--ios-accent);
      color: #FFFFFF;
      font-weight: 590;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }

    .scroll-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px 0 4px;
    }

    .scroll-dot {
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: var(--ios-fill-tertiary);
      transition: all var(--transition-ease);
    }

    .scroll-dot.active {
      background: var(--ios-accent);
      width: 16px;
    }

    .main-content {
      padding: 16px 16px 120px;
      flex: 1;
      position: relative;
      touch-action: pan-y;
    }

    .swipe-hint {
      text-align: center;
      font-size: var(--ios-font-caption);
      color: var(--ios-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
      padding: 12px 0 8px;
    }

    .week-container {
      will-change: transform, opacity;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.48);
      border-radius: var(--ios-radius-lg);
      margin-bottom: 14px;
      border: 0.5px solid var(--ios-glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 0 0 0 0.5px rgba(0, 0, 0, 0.06);
      transition: box-shadow var(--transition-ease), border-color var(--transition-ease), background var(--transition-ease);
      position: relative;
      overflow: hidden;
      backdrop-filter: url(#liquidGlassFilter) blur(6px);
      -webkit-backdrop-filter: url(#liquidGlassFilter) blur(6px);
    }

    @supports not (backdrop-filter: url(#liquidGlassFilter) blur(6px)) {
      .day-card {
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        background: rgba(255, 255, 255, 0.55);
      }
    }

    .day-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.7) 20%, rgba(255,255,255,0.7) 80%, rgba(255,255,255,0) 100%);
      opacity: 0.6;
      pointer-events: none;
      z-index: 1;
    }

    .day-card.open {
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      cursor: pointer;
      min-height: 44px;
      position: relative;
      z-index: 2;
    }

    .day-name {
      font-weight: 600;
      font-size: var(--ios-font-body);
      letter-spacing: -0.02em;
      color: var(--ios-text);
      text-shadow: 0 0 1px rgba(255,255,255,0.5);
    }

    .day-chevron {
      width: 16px;
      height: 16px;
      color: var(--ios-text-tertiary);
      transition: transform 0.35s cubic-bezier(0.22, 0.6, 0.36, 1);
      flex-shrink: 0;
    }

    .day-card.open .day-chevron {
      transform: rotate(180deg);
      color: var(--ios-accent);
    }

    .day-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.22, 0.6, 0.36, 1);
      will-change: max-height;
    }

    .day-body-inner {
      padding: 0 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 2;
    }

    .meal {
      background: rgba(255, 255, 255, 0.56);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: var(--ios-radius-sm);
      padding: 16px;
      position: relative;
      border: 0.5px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      transition: transform 0.15s ease;
    }

    .meal:active {
      transform: scale(0.985);
    }

    .meal-type {
      font-size: var(--ios-font-caption);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ios-accent);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .meal-title {
      font-weight: 600;
      font-size: var(--ios-font-body);
      margin-bottom: 4px;
      color: var(--ios-text);
      line-height: 1.3;
    }

    .meal-ingredients {
      font-size: var(--ios-font-footnote);
      color: var(--ios-text-secondary);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .meal-tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .meal-tag {
      font-size: var(--ios-font-caption);
      background: var(--ios-fill-tertiary);
      backdrop-filter: blur(10px);
      padding: 4px 10px;
      border-radius: 16px;
      color: var(--ios-accent);
      font-weight: 500;
    }

    .meal-why {
      font-size: var(--ios-font-footnote);
      color: #1C7A32;
      background: rgba(52, 199, 89, 0.08);
      backdrop-filter: blur(10px);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-weight: 500;
      line-height: 1.4;
      border: 0.5px solid rgba(52, 199, 89, 0.15);
    }

    .meal-detail-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--ios-font-footnote);
      font-weight: 590;
      color: var(--ios-accent);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px 0;
      letter-spacing: -0.01em;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .meal-detail-btn:active {
      color: #0056CC;
    }

    .meal-detail-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.3s cubic-bezier(0.22, 0.6, 0.36, 1);
    }

    .meal-detail-btn.expanded svg {
      transform: rotate(180deg);
    }

    .meal-detail-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.22, 0.6, 0.36, 1);
      background: rgba(255, 255, 255, 0.48);
      backdrop-filter: blur(18px);
      border-radius: 10px;
      margin-top: 8px;
      border: 0.5px solid rgba(255, 255, 255, 0.5);
      will-change: max-height;
    }

    .meal-detail-content {
      padding: 14px 16px;
      font-size: var(--ios-font-footnote);
      line-height: 1.5;
      color: var(--ios-text-secondary);
    }

    .micro-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .micro-item {
      background: rgba(0, 122, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 0.5px solid rgba(0, 122, 255, 0.15);
      padding: 4px 12px;
      border-radius: 16px;
      font-size: var(--ios-font-caption);
      font-weight: 500;
      color: var(--ios-accent);
    }

    .note-banner {
      background: rgba(255, 255, 255, 0.56);
      backdrop-filter: blur(18px);
      border: 0.5px solid rgba(255, 255, 255, 0.6);
      border-radius: var(--ios-radius-sm);
      padding: 14px 16px;
      margin-top: 12px;
      font-size: var(--ios-font-footnote);
      color: var(--ios-text-secondary);
      line-height: 1.4;
    }

    .fab {
      position: fixed;
      bottom: 32px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(0, 122, 255, 0.88);
      backdrop-filter: blur(18px);
      color: #FFFFFF;
      border: 0.5px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .fab:active {
      transform: scale(0.92);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      z-index: 300;
      display: flex;

      let currentWeek = 1;
      let openDayIndex = null;
      let isTransitioning = false;
      const weekSelector = document.getElementById('weekSelector');
      const scrollIndicator = document.getElementById('scrollIndicator');
      const mainContent = document.getElementById('mainContent');
      const fabBtn = document.getElementById('fabBtn');

      function updateScrollIndicator() {
        document.querySelectorAll('.scroll-dot').forEach((dot, i) => dot.classList.toggle('active', i + 1 === currentWeek));
      }

      function renderWeekSelector() {
        weekSelector.innerHTML = programData.weeks.map(w =>
          `<button class="week-btn ${w.id === currentWeek ? 'active' : ''}" data-week="${w.id}">${w.title}: ${w.subtitle}</button>`
        ).join('');
        scrollIndicator.innerHTML = programData.weeks.map(() => '<span class="scroll-dot"></span>').join('');
        updateScrollIndicator();
        document.querySelectorAll('.week-btn').forEach(b => {
          b.addEventListener('click', () => {
            if (isTransitioning) return;
            const wid = parseInt(b.dataset.week);
            if (wid !== currentWeek) switchWeek(wid, wid > currentWeek ? 1 : -1);
          });
        });
        const activeBtn = weekSelector.querySelector('.week-btn.active');
        if (activeBtn && window.innerWidth < 428) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }

      function buildMealHTML(m) {
        const info = mealExplanations[m.title];
        let html = `<div class="meal"><div class="meal-type">${m.type}</div><div class="meal-title">${m.title}</div><div class="meal-ingredients">${m.ingr}</div>`;
        if (m.tags && m.tags.length) html += `<div class="meal-tags-row">${m.tags.map(t => `<span class="meal-tag">${t}</span>`).join('')}</div>`;
        if (info) {
          html += `<div class="meal-why">${info.simple}</div>`;
          html += `<button class="meal-detail-btn"><span>Что внутри и зачем</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>`;
          html += `<div class="meal-detail-panel" style="max-height:0"><div class="meal-detail-content"><strong>Микроэлементы:</strong><div class="micro-list">${info.micro.map(x => `<span class="micro-item">${x}</span>`).join('')}</div><strong>Подробнее:</strong> ${info.benefit}</div></div>`;
        }
        html += '</div>';
        return html;
      }

      function buildWeekHTML(wid) {
        const w = programData.weeks.find(x => x.id === wid);
        if (!w) return '';
        let html = w.days.map((d, i) =>
          `<div class="day-card" data-day-index="${i}"><div class="day-header"><span class="day-name">${d.day}</span><svg class="day-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div><div class="day-body" style="max-height:0"><div class="day-body-inner">${d.meals.map(buildMealHTML).join('')}</div></div></div>`
        ).join('');
        if (programData.notes[wid]) html += `<div class="note-banner">${programData.notes[wid]}</div>`;
        return html;
      }

      function recalcDayBody(card) {
        const body = card.querySelector('.day-body');
        if (!body) return;
        if (card.classList.contains('open')) {
          body.style.maxHeight = body.scrollHeight + 'px';
        }
      }

      function bindEvents(container) {
        container.querySelectorAll('.day-header').forEach(h => {
          h.addEventListener('click', function(e) {
            e.stopPropagation();
            const idx = parseInt(this.closest('.day-card').dataset.dayIndex);
            toggleDay(idx);
          });
        });
        
        container.querySelectorAll('.meal-detail-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            e.preventDefault();
            const panel = this.nextElementSibling;
            const isOpen = panel.style.maxHeight !== '0px' && panel.style.maxHeight !== '';
            
            if (isOpen) {
              panel.style.maxHeight = '0';
              this.classList.remove('expanded');
            } else {
              panel.style.maxHeight = panel.scrollHeight + 'px';
              this.classList.add('expanded');
              gsap.fromTo(panel.querySelectorAll('.micro-item'), 
                { opacity: 0, scale: 0.8 }, 
                { opacity: 1, scale: 1, duration: 0.3, stagger: 0.04, ease: 'back.out(1.5)' }
              );
            }
            
            const card = this.closest('.day-card');
            if (card) {
              requestAnimationFrame(() => {
                recalcDayBody(card);
                if (!isOpen) {
                  setTimeout(() => {
                    const rect = panel.getBoundingClientRect();
                    if (rect.bottom > window.innerHeight - 100 || rect.top < 100) {
                      panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                  }, 350);
                }
              });
            }
          });
        });
      }

      function toggleDay(idx) {
        const cont = mainContent.querySelector('.week-container');
        if (!cont) return;
        const card = cont.querySelector(`.day-card[data-day-index="${idx}"]`);
        if (!card) return;
        
        const body = card.querySelector('.day-body');
        
        // Закрываем текущий открытый день если он есть
        if (openDayIndex !== null && openDayIndex !== idx) {
          const prev = cont.querySelector(`.day-card[data-day-index="${openDayIndex}"]`);
          if (prev) {
            prev.classList.remove('open');
            prev.querySelector('.day-body').style.maxHeight = '0';
          }
        }
        
        if (openDayIndex === idx) {
          // Закрываем
          card.classList.remove('open');
          body.style.maxHeight = '0';
          openDayIndex = null;
        } else {
          // Открываем
          card.classList.add('open');
          body.style.maxHeight = body.scrollHeight + 'px';
          openDayIndex = idx;
          
          // Анимируем появление приёмов пищи
          const meals = card.querySelectorAll('.meal');
          gsap.fromTo(meals, 
            { opacity: 0, y: 8 }, 
            { opacity: 1, y: 0, duration: 0.35, stagger: 0.05, ease: 'power2.out' }
          );
        }
      }

      function switchWeek(newId, dir) {
        if (isTransitioning) return;
        
        // Закрываем открытый день перед переключением
        if (openDayIndex !== null) {
          const cont = mainContent.querySelector('.week-container');
          if (cont) {
            const card = cont.querySelector(`.day-card[data-day-index="${openDayIndex}"]`);
            if (card) {
              card.classList.remove('open');
              card.querySelector('.day-body').style.maxHeight = '0';
            }
          }
          openDayIndex = null;
        }
        
        isTransitioning = true;
        const old = mainContent.querySelector('.week-container');
        const nc = document.createElement('div');
        nc.className = 'week-container';
        nc.innerHTML = buildWeekHTML(newId);
        mainContent.appendChild(nc);
        bindEvents(nc);
        
        gsap.set(nc, { x: dir * 80, opacity: 0 });
        if (old) gsap.set(old, { x: 0, opacity: 1 });
        
        gsap.timeline({
          onComplete: () => {
            if (old) old.remove();
            currentWeek = newId;
            renderWeekSelector();
            isTransitioning = false;
          }
        })
        .to(old || {}, { x: -dir * 60, opacity: 0, duration: 0.35, ease: 'power2.inOut' }, 0)
        .to(nc, { x: 0, opacity: 1, duration: 0.35, ease: 'power2.inOut' }, 0);
      }

      function initSwipe() {
        Observer.create({
          target: swipeZone,
          type: 'touch',
          onRight: () => { 
            if (!isTransitioning && currentWeek > 1) {
              switchWeek(currentWeek - 1, -1);
            }
          },
          onLeft: () => { 
            if (!isTransitioning && currentWeek < 4) {
              switchWeek(currentWeek + 1, 1);
            }
          },
          tolerance: 60
        });
      }

      function renderShoppingList() {
        const cats = {
          'Крупы': ['Гречка', 'Рис белый', 'Рис бурый', 'Киноа', 'Чечевица', 'Овсяные хлопья', 'Макароны', 'Перловка', 'Пшено', 'Нут'],
          'Консервы': ['Тунец', 'Горбуша', 'Печень трески', 'Фасоль', 'Томатная паста'],
          'Масла': ['Сливочное', 'Топлёное (гхи)', 'Подсолнечное', 'Оливковое', 'Тыквенное', 'Льняное'],
          'Орехи и семена': ['Семена льна', 'Тыквенные семечки', 'Грецкий орех', 'Чиа'],
          'Специи': ['Куркума', 'Чёрный перец', 'Корица', 'Паприка', 'Соль'],
          'Молочка': ['Творог 5%', 'Кефир', 'Ряженка', 'Мацони', 'Сметана', 'Сыр'],
          'Мясо и птица': ['Куриные бёдра', 'Куриное филе', 'Фарш куриный', 'Говяжий фарш', 'Говядина', 'Печень говяжья', 'Язык', 'Баранина'],
          'Рыба': ['Минтай', 'Хек', 'Скумбрия', 'Форель', 'Креветки'],
          'Овощи и фрукты': ['Яблоки', 'Бананы', 'Апельсины', 'Авокадо', 'Помидоры', 'Огурцы', 'Морковь', 'Свёкла', 'Капуста', 'Квашеная капуста', 'Цветная капуста', 'Брокколи', 'Фасоль стручковая', 'Шампиньоны', 'Лук', 'Чеснок', 'Зелень', 'Сельдерей', 'Руккола'],
          'Яйца и хлеб': ['Яйца (3-4 десятка)', 'Хлеб цельнозерновой', 'Хлеб бородинский']
        };
        shoppingContent.innerHTML = Object.entries(cats).map(([cat, items]) =>
          `<div class="shopping-category"><h4>${cat}</h4><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`
        ).join('');
      }

      function openModal() { modalOverlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
      function closeModal() { modalOverlay.classList.remove('open'); document.body.style.overflow = ''; }
      
      fabBtn.addEventListener('click', openModal);
      modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
      
      let tsY = 0;
      modalSheet.addEventListener('touchstart', e => { tsY = e.touches[0].clientY; }, { passive: true });
      modalSheet.addEventListener('touchmove', e => { 
        if (e.touches[0].clientY - tsY > 60 && modalSheet.scrollTop <= 0) closeModal(); 
      }, { passive: true });

      function init() {
        const c = document.createElement('div');
        c.className = 'week-container';
        c.innerHTML = buildWeekHTML(currentWeek);
        mainContent.appendChild(c);
        bindEvents(c);
        renderWeekSelector();
        renderShoppingList();
        initSwipe();
        
        gsap.fromTo('.navbar', { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out', delay: 0.1 });
        gsap.fromTo('.week-btn', { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.04, ease: 'power2.out', delay: 0.2 });
        gsap.fromTo('.day-card', { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.05, ease: 'power2.out', delay: 0.35 });
        gsap.fromTo('.fab', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.7)', delay: 0.7 });
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
