<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>План питания на 4 недели — Просто и полезно</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js">
    </script>
    <style>
        :root {
            --ton-bg: #0f1117;
            --ton-surface: #161822;
            --ton-surface-light: #1c1f2e;
            --ton-text: #f0f1f5;
            --ton-text-secondary: #9a9db5;
            --ton-primary: #0098ea;
            --ton-primary-glow: rgba(0, 152, 234, 0.3);
            --ton-accent: #00d4aa;
            --ton-border: #272a3a;
            --ton-tag-bg: #1e2132;
            --ton-info-bg: #1a1d2a;
            --ton-green: #00d4aa;
            --ton-green-bg: rgba(0, 212, 170, 0.08);
            --ton-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --ton-shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --ton-radius-sm: 8px;
            --ton-radius-md: 12px;
            --ton-radius-lg: 16px;
            --font-display: 'JetBrains Mono', 'Inter', monospace;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-body);
            background: var(--ton-bg);
            color: var(--ton-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100dvh;
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 17, 23, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--ton-border);
            padding: 14px 18px 10px;
        }
        .header-title {
            font-family: var(--font-display);
            font-size: clamp(1.1rem, 3.5vw, 1.35rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--ton-text);
            margin-bottom: 8px;
        }
        .result-badge {
            display: inline-block;
            background: var(--ton-green-bg);
            color: var(--ton-green);
            font-size: 0.78rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 0.01em;
            border: 1px solid rgba(0, 212, 170, 0.15);
        }
        .week-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 6px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .week-selector::-webkit-scrollbar {
            display: none;
        }
        .week-btn {
            flex-shrink: 0;
            padding: 10px 18px;
            border-radius: 24px;
            border: 1px solid var(--ton-border);
            background: var(--ton-surface);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--ton-text-secondary);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            letter-spacing: 0.01em;
            min-height: 42px;
            display: flex;
            align-items: center;
            scroll-snap-align: start;
            user-select: none;
        }
        .week-btn.active {
            background: var(--ton-primary);
            color: #fff;
            border-color: var(--ton-primary);
            box-shadow: 0 0 20px var(--ton-primary-glow);
            font-weight: 600;
        }
        .week-btn:active {
            transform: scale(0.96);
        }
        .scroll-indicator {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px 0 2px;
        }
        .scroll-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3a3d52;
            transition: var(--transition);
        }
        .scroll-dot.active {
            background: var(--ton-primary);
            box-shadow: 0 0 8px var(--ton-primary-glow);
            width: 18px;
            border-radius: 3px;
        }
        .swipe-hint {
            text-align: center;
            font-size: 0.68rem;
            color: #4a4d5e;
            padding: 10px 0 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .main-content {
            padding: 0 14px 110px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            min-height: 60vh;
        }
        .week-container {
            width: 100%;
            will-change: transform, opacity;
        }

        /* КАРТОЧКА ДНЯ */
        .day-card {
            background: var(--ton-surface);
            border-radius: var(--ton-radius-md);
            margin-bottom: 10px;
            box-shadow: var(--ton-shadow-sm);
            border: 1px solid var(--ton-border);
            transition: box-shadow var(--transition), border-color var(--transition);
        }
        .day-card.open {
            box-shadow: var(--ton-shadow-md);
            border-color: #303550;
        }
        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 16px;
            cursor: pointer;
            user-select: none;
            min-height: 44px;
            background: var(--ton-surface);
            border-radius: var(--ton-radius-md);
        }
        .day-name {
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.01em;
            color: var(--ton-text);
        }
        .day-chevron {
            width: 22px;
            height: 22px;
            transition: transform var(--transition);
            color: var(--ton-text-secondary);
            flex-shrink: 0;
        }
        .day-card.open .day-chevron {
            transform: rotate(180deg);
        }

        /* ТЕЛО ДНЯ — теперь overflow: visible и max-height не ограничен */
        .day-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-body-inner {
            padding: 0 16px 16px;
        }

        .meal {
            border-left: 3px solid var(--ton-border);
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 0 var(--ton-radius-sm) var(--ton-radius-sm) 0;
            background: var(--ton-surface-light);
            position: relative;
        }
        .meal-type {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ton-accent);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .meal-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: var(--ton-text);
        }
        .meal-ingredients {
            font-size: 0.8rem;
            color: var(--ton-text-secondary);
            line-height: 1.5;
            margin-bottom: 6px;
        }
        .meal-tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
        }
        .meal-tag {
            font-size: 0.65rem;
            background: var(--ton-tag-bg);
            padding: 3px 8px;
            border-radius: 6px;
            color: var(--ton-primary);
            font-weight: 500;
            border: 1px solid rgba(0, 152, 234, 0.12);
        }
        .meal-why {
            font-size: 0.75rem;
            color: #8ad4c0;
            background: rgba(0, 212, 170, 0.06);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            line-height: 1.5;
            border-left: 2px solid rgba(0, 212, 170, 0.4);
        }
        .meal-detail-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--ton-primary);
            background: rgba(0, 152, 234, 0.08);
            border: 1px solid rgba(0, 152, 234, 0.2);
            cursor: pointer;
            padding: 10px 14px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: all 0.2s;
            border-radius: 8px;
            margin-top: 4px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .meal-detail-btn:active {
            background: rgba(0, 152, 234, 0.18);
        }
        .meal-detail-btn svg {
            width: 12px;
            height: 12px;
            transition: transform var(--transition);
        }
        .meal-detail-btn.expanded svg {
            transform: rotate(180deg);
        }
        .meal-detail-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--ton-info-bg);
            border-radius: var(--ton-radius-sm);
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .meal-detail-panel.open {
            max-height: 600px;
        }
        .meal-detail-content {
            padding: 12px 14px;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #b0b5cc;
        }
        .meal-detail-content .micro-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }
        .meal-detail-content .micro-item {
            background: var(--ton-surface);
            border: 1px solid var(--ton-border);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-weight: 500;
            color: #c0c5da;
            white-space: nowrap;
        }
        .meal-detail-content strong {
            color: var(--ton-primary);
            font-weight: 600;
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 18px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--ton-primary);
            color: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 24px var(--ton-primary-glow);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .fab:active {
            transform: scale(0.92);
            background: #007dc7;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            background: var(--ton-surface);
            border-radius: var(--ton-radius-lg) var(--ton-radius-lg) 0 0;
            border-top: 1px solid var(--ton-border);
            width: 100%;
            max-width: 600px;
            max-height: 75vh;
            overflow-y: auto;
            padding: 20px 18px 36px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }
        .modal-handle {
            width: 36px;
            height: 4px;
            background: #3a3d50;
            border-radius: 2px;
            margin: 0 auto 18px;
        }
        .modal-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            color: var(--ton-text);
        }
        .shopping-category {
            margin-bottom: 14px;
        }
        .shopping-category h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ton-accent);
            margin-bottom: 6px;
        }
        .shopping-category ul {
            list-style: none;
        }
        .shopping-category li {
            font-size: 0.85rem;
            padding: 7px 0;
            border-bottom: 1px solid var(--ton-border);
            color: var(--ton-text-secondary);
        }
        .note-banner {
            background: rgba(0, 152, 234, 0.05);
            border: 1px solid rgba(0, 152, 234, 0.15);
            border-radius: var(--ton-radius-sm);
            padding: 12px 14px;
            margin-top: 12px;
            font-size: 0.75rem;
            color: #8ab8d8;
            line-height: 1.5;
        }

        @media (min-width: 600px) {
            .main-content {
                padding: 0 20px 110px;
            }
            .header {
                padding: 18px 20px 12px;
            }
            .day-header {
                padding: 16px 18px;
            }
            .day-body-inner {
                padding: 0 18px 18px;
            }
            .scroll-indicator {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="header-title">План питания на 4 недели</h1>
        <div class="result-badge">Ожидаемый результат: минус 3–5 кг, больше энергии, меньше тяги к сладкому</div>
        <div class="week-selector" id="weekSelector"></div>
        <div class="scroll-indicator" id="scrollIndicator"></div>
    </header>

    <main class="main-content" id="mainContent">
        <div class="swipe-hint">← листайте недели →</div>
    </main>

    <button class="fab" id="fabBtn" aria-label="Список покупок">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>
    </button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-handle"></div>
            <div class="modal-title">Список покупок на месяц</div>
            <div id="shoppingContent"></div>
        </div>
    </div>

    <script>
        (function() {
            const mealExplanations = {
                'Омлет с укропом': { simple: 'Яйца — чистый белок. Съел утром и до обеда сыт.', micro: ['Витамин A',
                        'Витамин D', 'Холин', 'Селен'
                    ], benefit: 'Холин для памяти. Витамин D и селен для иммунитета.' },
                'Квашеная капуста + хлеб с гхи': { simple: 'Капуста — пробиотики для живота. Гхи помогает кишечнику.',
                    micro: ['Витамин C', 'Витамин K2', 'Пробиотики'], benefit: 'Масляная кислота из гхи заживляет кишечник.' },
                'Куриное бедро с гречкой': { simple: 'Гречка — энергия на 4 часа. Бедро — сытно и не жирно.',
                    micro: ['Цинк', 'Железо', 'Магний', 'Рутин'], benefit: 'Цинк для мужского здоровья. Гречка укрепляет сосуды.' },
                'Творог с льняным маслом': { simple: 'Творог на ночь — мышцы восстанавливаются. Масло для гормонов.',
                    micro: ['Казеин', 'Омега-3', 'Лигнаны', 'Кальций'], benefit: 'Казеин питает мышцы 6–7 часов.' },
                'Глазунья с помидором': { simple: 'Помидоры после жарки полезнее. Яйца дают сытость.', micro: ['Ликопин',
                        'Лютеин', 'Биотин'
                    ], benefit: 'Ликопин защищает сердце. Лютеин для зрения.' },
                'Суп с фрикадельками': { simple: 'Лёгкий суп без картошки — не клонит в сон.', micro: ['Коллаген',
                        'Витамин K', 'Клетчатка'], benefit: 'Стручковая фасоль для пищеварения.' },
                'Куриная грудка + цветная капуста': { simple: 'Лёгкий ужин. Капуста помогает печени.', micro: ['Витамин B6',
                        'Фосфор', 'Глюкозинолаты'], benefit: 'Глюкозинолаты помогают печени чиститься.' },
                'Яйца + куриный паштет': { simple: 'Печень — железо против усталости.', micro: ['Железо', 'Витамин A',
                        'Медь'], benefit: 'Гемовое железо усваивается лучше растительного.' },
                'Запеканка с брокколи': { simple: 'Брокколи — супер-овощ. Сыр и яйцо для вкуса.', micro: ['Сульфорафан',
                        'Кальций', 'Витамин C'], benefit: 'Сульфорафан защищает от болезней.' },
                'Кефир + орехи': { simple: 'Кефир на ночь — спится лучше. Орехи для мозга.', micro: ['Мелатонин', 'Магний',
                        'Триптофан'], benefit: 'Магний расслабляет, триптофан успокаивает.' },
                'Омлет с помидорами': { simple: 'Классика. Быстро и сытно.', micro: ['Ликопин', 'Холин', 'Витамин C'],
                    benefit: 'Стабильный сахар до обеда.' },
                'Курица в томате с рисом': { simple: 'Бурый рис — медленные углеводы. Курица в томате — сочно.',
                    micro: ['Ликопин', 'Цинк', 'Витамин B3'], benefit: 'Ликопин из томатной пасты в 5 раз активнее.' },
                'Творог с яблоком': { simple: 'Яблоко и корица — сладко без сахара.', micro: ['Пектин', 'Казеин',
                        'Кверцетин'], benefit: 'Кверцетин — мягкий детокс.' },
                'Яйца пашот + руккола': { simple: 'Руккола — зелень для мужчин. Яйца за 3 минуты.', micro: ['Фолаты',
                        'Витамин K', 'Горчичные масла'], benefit: 'Фолаты для синтеза клеток.' },
                'Тунец с макаронами': { simple: 'Макароны из твёрдых сортов. Тунец — готовая рыба.', micro: ['DHA', 'Селен',
                        'Витамин B3'], benefit: 'DHA для мозга.' },
                'Куриное филе с паприкой': { simple: 'Паприка ускоряет обменку. Курица — просто и сытно.',
                    micro: ['Витамин C', 'Капсаицин', 'Витамин B6'], benefit: 'Термогенный эффект паприки.' },
                'Овсянка с бананом': { simple: 'Овсянка — заряд на полдня. Банан — калий.', micro: ['Бета-глюкан', 'Калий',
                        'Витамин B1'], benefit: 'Бета-глюкан снижает холестерин.' },
                'Белый рис + грудка': { simple: 'После нагрузки — быстрое восстановление.', micro: ['Лейцин', 'Углеводы',
                        'Цинк'], benefit: 'Инсулин доставляет белок в мышцы.' },
                'Салат с курицей и яблоком': { simple: 'Лёгкий ужин без тяжести.', micro: ['Кверцетин', 'Глицин',
                    'Клетчатка'], benefit: 'Кверцетин снижает воспаление.' },
                'Овсяноблин с сыром': { simple: 'Овсянка в виде блина — вкуснее. Сыр для вкуса.', micro: ['Казеин',
                        'Углеводы', 'Кальций'], benefit: 'Стабильная энергия без тяжести.' },
                'Картофель с минтаем': { simple: 'Картошка в мундире полезна. Минтай — родная рыба.', micro: ['Калий', 'Йод',
                        'Витамин B12'], benefit: 'Калий восполняет потери с потом.' },
                'Творог с зеленью': { simple: 'Творог + укроп = классика. Сытно, полезно, дёшево.', micro: ['Казеин',
                        'Хлорофилл', 'Кальций'
                    ], benefit: 'Хлорофилл зелени очищает кровь. Казеин питает мышцы всю ночь.' },
                'Бутерброды с горбушей': { simple: 'Горбуша из банки — быстро и полезно.', micro: ['DHA', 'Витамин D',
                        'Астаксантин'], benefit: 'Астаксантин защищает кожу.' },
                'Чечевичный суп': { simple: 'Чечевица — белок без мяса. Сытно.', micro: ['Магний', 'Фолаты', 'Клетчатка'],
                    benefit: 'Магний снижает кортизол.' },
                'Скумбрия + свёкла': { simple: 'Скумбрия — рыба для мужиков. Свёкла чистит кровь.', micro: ['EPA', 'Бетаин',
                        'Нитраты'], benefit: 'Нитраты свёклы расширяют сосуды.' },
                'Омлет с креветками': { simple: 'Креветки — йод для щитовидки.', micro: ['Йод', 'Астаксантин', 'Цинк'],
                    benefit: 'Йод регулирует метаболизм.' },
                'Хек с гречкой': { simple: 'Хек — нежная рыба, дёшево.', micro: ['Фосфор', 'Магний', 'Витамин B6'],
                    benefit: 'Фосфор для энергии клеток.' },
                'Котлеты из минтая': { simple: 'Рыбные котлеты — вкусно и полезно.', micro: ['Белок', 'Селен', 'Фосфор'],
                    benefit: 'Минтай — гипоаллергенный белок.' },
                'Салат с фасолью': { simple: 'Фасоль из банки — готовый белок.', micro: ['Клетчатка', 'Фолаты', 'Магний'],
                    benefit: 'Клетчатка кормит микрофлору.' },

                    { id: 4, title: 'Неделя 4', subtitle: 'Овощи и бобовые', days: [

                        ]},
                        { day: 'Вторник', meals: [
                            { type: 'Завтрак', title: 'Омлет + хлеб', ingr: '3 яйца, хлеб, масло', tags: ['Быстро'] },

                        ]},
                        { day: 'Среда', meals: [

                        { day: 'Четверг', meals: [
                            { type: 'Завтрак', title: 'Яичница + помидор', ingr: '3 яйца, помидор', tags: ['Просто'] },

                            { type: 'Ужин', title: 'Кефир + яблоко', ingr: '250 мл кефира, яблоко', tags: ['Лёгкий'] }
                        ]},
                        { day: 'Пятница', meals: [
                            { type: 'Завтрак', title: 'Яйца + печень трески', ingr: '2 яйца, 1 ст.л. печени трески', tags: ['Витамин D'] },
                            { type: 'Обед', title: 'Картофельная запеканка', ingr: '200 г картофеля, 100 г грибов, яйцо', tags: ['Сытная'] },
                            { type: 'Ужин', title: 'Творог + зелень', ingr: '200 г творога, кинза', tags: ['Стандарт'] }
                        ]},
                        { day: 'Суббота', meals: [
                            { type: 'Завтрак', title: 'Каша из киноа', ingr: '50 г киноа, 5 г масла', tags: ['Вместо гречки'] },
                            { type: 'Обед', title: 'Паста с сыром и яйцом', ingr: '150 г макарон, яйцо, 30 г пармезана', tags: ['Карбонара'] },
                            { type: 'Ужин', title: 'Фасоль в томате', ingr: '200 г фасоли, томаты, паприка', tags: ['Сытный'] }
                        ]},
                        { day: 'Воскресенье', meals: [
                            { type: 'Завтрак', title: 'Банан + творог', ingr: '1 банан, 100 г творога', tags: ['Быстрый'] },
                            { type: 'Обед', title: 'Рис с овощами и омлетом', ingr: '150 г риса, омлет из 2 яиц, овощи', tags: ['Всё в одном'] },
                            { type: 'Ужин', title: 'Ряженка', ingr: '250 мл ряженки', tags: ['На ночь'] }
                        ]}
                    ]}
                ],
                notes: { 1: 'Вода с лимоном утром. Кофе без сахара через 30 мин после завтрака.', 2: 'Вода с лимоном утром. Кофе без сахара через 30 мин после завтрака.',
                    3: 'Вода с лимоном утром. Кофе без сахара через 30 мин после завтрака.', 4: 'Вода с лимоном утром. Кофе без сахара через 30 мин после завтрака.' }
            };

            let currentWeek = 1;
            let openDayIndex = null;
            let isTransitioning = false;
            const weekSelector = document.getElementById('weekSelector');
            const scrollIndicator = document.getElementById('scrollIndicator');
            const mainContent = document.getElementById('mainContent');
            const fabBtn = document.getElementById('fabBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalSheet = document.getElementById('modalSheet');
            const shoppingContent = document.getElementById('shoppingContent');

            function updateScrollIndicator() {
                scrollIndicator.querySelectorAll('.scroll-dot').forEach((dot, i) => dot.classList.toggle('active', i + 1 ===
                    currentWeek));
            }

            function renderWeekSelector() {
                weekSelector.innerHTML = programData.weeks.map(w =>
                    `<button class="week-btn ${w.id===currentWeek?'active':''}" data-week="${w.id}">${w.title}: ${w.subtitle}</button>`
                ).join('');
                scrollIndicator.innerHTML = programData.weeks.map(() => '<span class="scroll-dot"></span>').join('');
                updateScrollIndicator();
                weekSelector.querySelectorAll('.week-btn').forEach(b => b.addEventListener('click', () => {
                    if (isTransitioning) return;
                    const wid = parseInt(b.dataset.week);
                    if (wid !== currentWeek) switchWeek(wid, wid > currentWeek ? 1 : -1);
                }));
                const ab = weekSelector.querySelector('.week-btn.active');
                if (ab && innerWidth < 600) ab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }

            function buildMealHTML(m) {
                const info = mealExplanations[m.title];
                let h = `<div class="meal"><div class="meal-type">${m.type}</div><div class="meal-title">${m.title}</div><div class="meal-ingredients">${m.ingr}</div>`;
                if (m.tags && m.tags.length) h +=
                    `<div class="meal-tags-row">${m.tags.map(t=>`<span class="meal-tag">${t}</span>`).join('')}</div>`;
                if (info) {
                    h += `<div class="meal-why">${info.simple}</div>`;
                    h +=
                        `<button class="meal-detail-btn"><span>Что внутри и зачем</span> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>`;
                    h +=
                        `<div class="meal-detail-panel"><div class="meal-detail-content"><strong>Микроэлементы:</strong><div class="micro-list">${info.micro.map(x=>`<span class="micro-item">${x}</span>`).join('')}</div><strong>Подробнее:</strong> ${info.benefit}</div></div>`;
                }
                h += '</div>';
                return h;
            }

            function buildWeekHTML(wid) {
                const w = programData.weeks.find(x => x.id === wid);
                if (!w) return '';
                let h = w.days.map((d, i) =>
                    `<div class="day-card" data-day-index="${i}"><div class="day-header"><span class="day-name">${d.day}</span><svg class="day-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div><div class="day-body"><div class="day-body-inner">${d.meals.map(m=>buildMealHTML(m)).join('')}</div></div></div>`
                ).join('');
                if (programData.notes[wid]) h += `<div class="note-banner">${programData.notes[wid]}</div>`;
                return h;
            }

            // КЛЮЧЕВАЯ ФУНКЦИЯ: пересчёт высоты контейнера дня
            function recalcDayBody(card) {
                const body = card.querySelector('.day-body');
                if (!body) return;
                if (card.classList.contains('open')) {
                    // Принудительно сбрасываем и пересчитываем
                    body.style.maxHeight = 'none';
                    const h = body.scrollHeight;
                    body.style.maxHeight = h + 'px';
                }
            }

            function bindEvents(container) {
                container.querySelectorAll('.day-header').forEach(h => h.addEventListener('click', () => toggleDay(parseInt(h
                    .closest('.day-card').dataset.dayIndex))));
                container.querySelectorAll('.meal-detail-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        e.preventDefault();
                        const panel = this.nextElementSibling;
                        const isOpen = panel.classList.contains('open');
                        if (isOpen) {
                            panel.classList.remove('open');
                            panel.style.maxHeight = '0';
                            this.classList.remove('expanded');
                        } else {
                            panel.classList.add('open');
                            panel.style.maxHeight = panel.scrollHeight + 'px';
                            this.classList.add('expanded');
                            gsap.fromTo(panel.querySelectorAll('.micro-item'), { opacity: 0, scale: 0.8 }, { opacity: 1,
                                scale: 1, duration: 0.3, stagger: 0.04, ease: 'back.out(1.5)' });
                        }
                        const card = this.closest('.day-card');
                        if (card) {
                            // Небольшая задержка, чтобы панель успела раскрыться
                            setTimeout(() => recalcDayBody(card), 400);
                            if (panel.classList.contains('open')) {
                                setTimeout(() => {
                                    const rect = panel.getBoundingClientRect();
                                    if (rect.bottom > window.innerHeight - 100 || rect.top < 100) {
                                        panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    }
                                }, 450);
                            }
                        }
                    });
                });
            }

            function clearMainContent() {
                mainContent.querySelectorAll('.week-container').forEach(c => c.remove());
                openDayIndex = null;
            }

            function renderWeekDirect(wid) {
                clearMainContent();
                const c = document.createElement('div');
                c.className = 'week-container';
                c.dataset.weekContainer = wid;
                c.innerHTML = buildWeekHTML(wid);
                mainContent.appendChild(c);
                bindEvents(c);
                currentWeek = wid;
                renderWeekSelector();
            }

            function switchWeek(newId, dir) {
                if (isTransitioning) return;
                isTransitioning = true;
                const old = mainContent.querySelector('.week-container');
                const nc = document.createElement('div');
                nc.className = 'week-container';
                nc.dataset.weekContainer = newId;
                nc.innerHTML = buildWeekHTML(newId);
                mainContent.appendChild(nc);
                bindEvents(nc);
                const mx = dir * 80;
                gsap.set(nc, { x: mx * 2, opacity: 0 });
                if (old) gsap.set(old, { x: 0, opacity: 1 });
                openDayIndex = null;
                gsap.timeline({
                    onComplete: () => {
                        if (old) old.remove();
                        currentWeek = newId;
                        renderWeekSelector();
                        isTransitioning = false;
                    }
                }).to(old || {}, { x: -mx, opacity: 0, duration: 0.35, ease: 'power2.inOut' }, 0)
                    .to(nc, { x: 0, opacity: 1, duration: 0.35, ease: 'power2.inOut' }, 0);
            }

            function toggleDay(di) {
                const cont = mainContent.querySelector('.week-container');
                if (!cont) return;
                const card = cont.querySelector(`[data-day-index="${di}"]`);
                if (!card) return;
                if (openDayIndex === di) {
                    openDayIndex = null;
                    card.classList.remove('open');
                    card.querySelector('.day-body').style.maxHeight = '0';
                } else {
                    if (openDayIndex !== null) {
                        const pc = cont.querySelector(`[data-day-index="${openDayIndex}"]`);
                        if (pc) { pc.classList.remove('open');
                            pc.querySelector('.day-body').style.maxHeight = '0'; }
                    }
                    openDayIndex = di;
                    card.classList.add('open');
                    const body = card.querySelector('.day-body');
                    // Временно убираем ограничение, чтобы узнать реальную высоту
                    body.style.maxHeight = 'none';
                    const h = body.scrollHeight;
                    body.style.maxHeight = '0';
                    // Запускаем анимацию раскрытия
                    requestAnimationFrame(() => {
                        body.style.maxHeight = h + 'px';
                    });
                    gsap.fromTo(card.querySelectorAll('.meal'), { opacity: 0, x: -15 }, { opacity: 1, x: 0, duration: 0.35,
                        stagger: 0.06, ease: 'power2.out' });
                }
            }

            function initSwipe() {
                Observer.create({
                    target: mainContent,
                    type: 'touch',
                    onRight: () => { if (!isTransitioning && currentWeek > 1) switchWeek(currentWeek - 1, -1); },
                    onLeft: () => { if (!isTransitioning && currentWeek < 4) switchWeek(currentWeek + 1, 1); },
                    tolerance: 80
                });
            }

            function renderShoppingList() {
                const cats = {
                    'Крупы': ['Гречка', 'Рис белый', 'Рис бурый', 'Киноа', 'Чечевица', 'Овсяные хлопья', 'Макароны',
                        'Перловка', 'Пшено', 'Нут'],
                    'Консервы': ['Тунец', 'Горбуша', 'Печень трески', 'Фасоль', 'Томатная паста'],
                    'Масла': ['Сливочное', 'Топлёное (гхи)', 'Подсолнечное', 'Оливковое', 'Тыквенное', 'Льняное'],
                    'Орехи и семена': ['Семена льна', 'Тыквенные семечки', 'Грецкий орех', 'Чиа'],
                    'Специи': ['Куркума', 'Чёрный перец', 'Корица', 'Паприка', 'Соль'],
                    'Молочка': ['Творог 5%', 'Кефир', 'Ряженка', 'Мацони', 'Сметана', 'Сыр'],
                    'Мясо и птица': ['Куриные бёдра', 'Куриное филе', 'Фарш куриный', 'Говяжий фарш', 'Говядина',
                        'Печень говяжья', 'Язык', 'Баранина'],
                    'Рыба': ['Минтай', 'Хек', 'Скумбрия', 'Форель', 'Креветки'],
                    'Овощи и фрукты': ['Яблоки', 'Бананы', 'Апельсины', 'Авокадо', 'Помидоры', 'Огурцы', 'Морковь',
                        'Свёкла', 'Капуста', 'Квашеная капуста', 'Цветная капуста', 'Брокколи', 'Фасоль стручковая',
                        'Шампиньоны', 'Лук', 'Чеснок', 'Зелень', 'Сельдерей', 'Руккола'],
                    'Яйца и хлеб': ['Яйца (3-4 десятка)', 'Хлеб цельнозерновой', 'Хлеб бородинский']
                };
                shoppingContent.innerHTML = Object.entries(cats).map(([cat, items]) =>
                    `<div class="shopping-category"><h4>${cat}</h4><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`
                ).join('');
            }

            function openModal() { modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden'; }

            function closeModal() { modalOverlay.classList.remove('open');
                document.body.style.overflow = ''; }
            fabBtn.addEventListener('click', openModal);
            modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
            let tsY = 0;
            modalSheet.addEventListener('touchstart', e => { tsY = e.touches[0].clientY; }, { passive: true });
            modalSheet.addEventListener('touchmove', e => { if (e.touches[0].clientY - tsY > 60 && modalSheet.scrollTop <=
                    0) closeModal(); }, { passive: true });

            function init() {
                clearMainContent();
                renderWeekDirect(currentWeek);
                renderShoppingList();
                initSwipe();
                gsap.fromTo('.header', { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out',
                    delay: 0.1 });
                gsap.fromTo('.week-btn', { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.05,
                    ease: 'power2.out', delay: 0.2 });
                gsap.fromTo('.day-card', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.06,
                    ease: 'power2.out', delay: 0.4 });
                gsap.fromTo('.fab', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.7)',
                    delay: 0.8 });
            }
            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
