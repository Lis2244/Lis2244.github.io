<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>План питания на 4 недели — Просто и полезно</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Observer.min.js">
    </script>
    <style>
        :root {
            --ton-bg: #0f1117;
            --ton-surface: #161822;
            --ton-surface-light: #1c1f2e;
            --ton-text: #f0f1f5;
            --ton-text-secondary: #9a9db5;
            --ton-primary: #0098ea;
            --ton-primary-glow: rgba(0, 152, 234, 0.3);
            --ton-accent: #00d4aa;
            --ton-accent-glow: rgba(0, 212, 170, 0.25);
            --ton-border: #272a3a;
            --ton-tag-bg: #1e2132;
            --ton-info-bg: #1a1d2a;
            --ton-green: #00d4aa;
            --ton-green-bg: rgba(0, 212, 170, 0.08);
            --ton-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --ton-shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --ton-radius-sm: 8px;
            --ton-radius-md: 12px;
            --ton-radius-lg: 16px;
            --font-display: 'JetBrains Mono', 'Inter', monospace;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-body);
            background: var(--ton-bg);
            color: var(--ton-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100dvh;
            font-size: 16px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 17, 23, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--ton-border);
            padding: 14px 18px 10px;
        }
        .header-title {
            font-family: var(--font-display);
            font-size: clamp(1.1rem, 3.5vw, 1.35rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--ton-text);
            margin-bottom: 8px;
        }
        .result-badge {
            display: inline-block;
            background: var(--ton-green-bg);
            color: var(--ton-green);
            font-size: 0.78rem;
            font-weight: 500;
            padding: 5px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 0.01em;
            border: 1px solid rgba(0, 212, 170, 0.15);
        }

        .week-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 6px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
        .week-selector::-webkit-scrollbar {
            display: none;
        }
        .week-btn {
            flex-shrink: 0;
            padding: 10px 18px;
            border-radius: 24px;
            border: 1px solid var(--ton-border);
            background: var(--ton-surface);
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--ton-text-secondary);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            letter-spacing: 0.01em;
            min-height: 42px;
            display: flex;
            align-items: center;
            scroll-snap-align: start;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .week-btn.active {
            background: var(--ton-primary);
            color: #fff;
            border-color: var(--ton-primary);
            box-shadow: 0 0 20px var(--ton-primary-glow), 0 2px 8px rgba(0, 152, 234, 0.4);
            font-weight: 600;
        }
        .week-btn:active {
            transform: scale(0.96);
        }

        .scroll-indicator {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px 0 2px;
        }
        .scroll-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #3a3d52;
            transition: var(--transition);
        }
        .scroll-dot.active {
            background: var(--ton-primary);
            box-shadow: 0 0 8px var(--ton-primary-glow);
            width: 18px;
            border-radius: 3px;
        }

        .swipe-hint {
            text-align: center;
            font-size: 0.68rem;
            color: #4a4d5e;
            padding: 10px 0 4px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .main-content {
            padding: 0 14px 110px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            min-height: 60vh;
        }
        .week-container {
            width: 100%;
            will-change: transform, opacity;
        }

        .day-card {
            background: var(--ton-surface);
            border-radius: var(--ton-radius-md);
            margin-bottom: 10px;
            box-shadow: var(--ton-shadow-sm);
            overflow: visible;
            border: 1px solid var(--ton-border);
            transition: box-shadow var(--transition), border-color var(--transition);
        }
        .day-card.open {
            box-shadow: var(--ton-shadow-md);
            border-color: #303550;
        }
        .day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 16px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 44px;
            background: var(--ton-surface);
            border-radius: var(--ton-radius-md);
            position: relative;
            z-index: 2;
        }
        .day-name {
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.01em;
            color: var(--ton-text);
        }
        .day-chevron {
            width: 22px;
            height: 22px;
            transition: transform var(--transition);
            color: var(--ton-text-secondary);
            flex-shrink: 0;
        }
        .day-card.open .day-chevron {
            transform: rotate(180deg);
        }
        .day-body {
            max-height: 0;
            overflow: visible;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-body-inner {
            padding: 0 16px 16px;
        }

        .meal {
            border-left: 3px solid var(--ton-border);
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 0 var(--ton-radius-sm) var(--ton-radius-sm) 0;
            background: var(--ton-surface-light);
            transition: border-color var(--transition);
            position: relative;
        }
        .meal-type {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ton-accent);
            font-weight: 600;
            margin-bottom: 2px;
        }
        .meal-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: var(--ton-text);
        }
        .meal-ingredients {
            font-size: 0.8rem;
            color: var(--ton-text-secondary);
            line-height: 1.5;
            margin-bottom: 6px;
        }
        .meal-tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 6px;
        }
        .meal-tag {
            display: inline-block;
            font-size: 0.65rem;
            background: var(--ton-tag-bg);
            padding: 3px 8px;
            border-radius: 6px;
            color: var(--ton-primary);
            letter-spacing: 0.02em;
            font-weight: 500;
            border: 1px solid rgba(0, 152, 234, 0.12);
        }
        .meal-why {
            font-size: 0.75rem;
            color: #8ad4c0;
            background: rgba(0, 212, 170, 0.06);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
            line-height: 1.5;
            border-left: 2px solid rgba(0, 212, 170, 0.4);
        }
        .meal-detail-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--ton-primary);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 0;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .meal-detail-btn:active {
            opacity: 0.6;
        }
        .meal-detail-btn svg {
            width: 12px;
            height: 12px;
            transition: transform var(--transition);
        }
        .meal-detail-btn.expanded svg {
            transform: rotate(180deg);
        }

        .meal-detail-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--ton-info-bg);
            border-radius: var(--ton-radius-sm);
            margin-top: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            z-index: 10;
        }
        .meal-detail-panel.open {
            max-height: 500px;
        }
        .meal-detail-content {
            padding: 12px 14px;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #b0b5cc;
        }
        .meal-detail-content .micro-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0;
        }
        .meal-detail-content .micro-item {
            background: var(--ton-surface);
            border: 1px solid var(--ton-border);
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 0.68rem;
            font-weight: 500;
            color: #c0c5da;
            white-space: nowrap;
        }
        .meal-detail-content strong {
            color: var(--ton-primary);
            font-weight: 600;
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 18px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--ton-primary);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.4rem;
            box-shadow: 0 0 24px var(--ton-primary-glow), 0 4px 12px rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .fab:active {
            transform: scale(0.92);
            background: #007dc7;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-sheet {
            background: var(--ton-surface);
            border-radius: var(--ton-radius-lg) var(--ton-radius-lg) 0 0;
            border-top: 1px solid var(--ton-border);
            width: 100%;
            max-width: 600px;
            max-height: 75vh;
            overflow-y: auto;
            padding: 20px 18px 36px;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }
        .modal-handle {
            width: 36px;
            height: 4px;
            background: #3a3d50;
            border-radius: 2px;
            margin: 0 auto 18px;
        }
        .modal-title {
            font-family: var(--font-display);
            font-size: 1.2rem;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
            color: var(--ton-text);
        }
        .shopping-category {
            margin-bottom: 14px;
        }
        .shopping-category h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ton-accent);
            margin-bottom: 6px;
        }
        .shopping-category ul {
            list-style: none;
        }
        .shopping-category li {
            font-size: 0.85rem;
            padding: 7px 0;
            border-bottom: 1px solid var(--ton-border);
            color: var(--ton-text-secondary);
        }

        .note-banner {
            background: rgba(0, 152, 234, 0.05);
            border: 1px solid rgba(0, 152, 234, 0.15);
            border-radius: var(--ton-radius-sm);
            padding: 12px 14px;
            margin-top: 12px;
            font-size: 0.75rem;
            color: #8ab8d8;
            line-height: 1.5;
        }

        @media (min-width: 600px) {
            .main-content {
                padding: 0 20px 110px;
            }
            .header {
                padding: 18px 20px 12px;
            }
            .day-header {
                padding: 16px 18px;
            }
            .day-body-inner {
                padding: 0 18px 18px;
            }
            .scroll-indicator {
                display: none;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="header-title">План питания на 4 недели</h1>
        <div class="result-badge">Ожидаемый результат: минус 3–5 кг, больше энергии, меньше тяги к сладкому</div>
        <div class="week-selector" id="weekSelector"></div>
        <div class="scroll-indicator" id="scrollIndicator"></div>
    </header>

    <main class="main-content" id="mainContent">
        <div class="swipe-hint">← листайте недели →</div>
    </main>

    <button class="fab" id="fabBtn" aria-label="Список покупок">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="12" y2="17"/></svg>
    </button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-sheet" id="modalSheet">
            <div class="modal-handle"></div>
            <div class="modal-title">Список покупок на месяц</div>
            <div id="shoppingContent"></div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== ПОЛНЫЕ ОПИСАНИЯ ДЛЯ ВСЕХ БЛЮД ====================
            const mealSimpleExplanations = {
                'Омлет с укропом': 'Яйца — это чистый белок. Съел утром — и до обеда не вспоминаешь про еду. Нет скачков сахара, нет тумана в голове.',
                'Квашеная капуста + хлеб с гхи': 'Квашеная капуста — наши родные пробиотики для здорового живота. Гхи — топлёное масло, от него не поправляются, оно помогает кишечнику.',
                'Куриное бедро с гречкой': 'Гречка — медленные углеводы, энергия на 4 часа. Куриное бедро — сытно и не жирно. Специи разгоняют обменку.',
                'Творог с льняным маслом': 'Творог на ночь — чтобы мышцы восстанавливались, пока спишь. Льняное масло — для мужского здоровья и нормального гормонального фона.',
                'Глазунья с помидором': 'Помидоры после жарки полезнее сырых. Ликопин защищает сердце и сосуды. Яйца дают силу и сытость.',
                'Суп с фрикадельками': 'Лёгкий суп без картошки — не развозит в сон после обеда. Фрикадельки из курицы — белок без лишнего жира.',
                'Куриная грудка + цветная капуста': 'На ужин — лёгкое. Цветная капуста помогает печени чиститься. Куриная грудка — постный белок, не откладывается в бока.',
                'Яйца + куриный паштет': 'Печень — кладезь железа. Если чувствуешь усталость к вечеру — тебе сюда. Яйца — всегда хорошо.',
                'Запеканка с брокколи': 'Брокколи — один из самых полезных овощей. Сыр и яйцо делают блюдо вкусным, а не пресным.',
                'Кефир + орехи': 'Кефир на ночь — спится лучше. Орехи — горсть, не больше. Это полезный жир для мозга.',
                'Омлет с помидорами': 'Классика. Быстро, вкусно, сытно. Помидоры для сердца, яйца для мышц.',
                'Курица в томате с рисом': 'Бурый рис — не белый, усваивается медленно. Курица в томате — сочно, вкусно, не калорийно.',
                'Творог с яблоком': 'Яблоко и корица — сладко без сахара. Творог — белок на ночь. Простой и дешёвый ужин.',
                'Яйца пашот + руккола': 'Руккола — это зелень для мужчин. Яйца пашот — звучит по-ресторанному, готовится за 3 минуты.',
                'Тунец с макаронами': 'Макароны можно! Только из твёрдых сортов. Тунец — готовая рыба, не надо готовить. Быстрый обед.',
                'Куриное филе с паприкой': 'Паприка ускоряет метаболизм. Курица — просто и сытно. Огурец — вода и свежесть.',
                'Овсянка с бананом': 'Овсянка — заряд на полдня. Банан — калий для сердца. Съел и пошёл горы сворачивать.',
                'Белый рис + грудка': 'После тренировки — самое то. Белый рис быстро восстанавливает силы, грудка даёт мышцам строительный материал.',
                'Салат с курицей и яблоком': 'Лёгкий ужин. Никакой тяжести в животе. Яблоко и сельдерей — клетчатка, курица — белок.',
                'Овсяноблин с сыром': 'Овсянка в виде блина — вкуснее, чем каша. Сыр для вкуса. Хорошее начало дня.',
                'Картофель с минтаем': 'Картошка не враг! В мундире она полезная. Минтай — наша родная рыба, дешёвая и полезная.',
                'Творог с зеленью': 'Творог + укроп = классика. Сытно, полезно, дёшево. На ночь — лучше не придумаешь.',
                'Бутерброды с горбушей': 'Горбуша из банки — это не стыдно. Омега-3 для мозгов. Быстрый завтрак, если опаздываешь.',
                'Чечевичный суп': 'Чечевица — это белок для тех, кто устал от мяса. Сытно, как мясной суп, но легче.',
                'Скумбрия + свёкла': 'Скумбрия — рыба для мужиков. Свёкла чистит кровь. Вместе — мощная штука для здоровья.',
                'Омлет с креветками': 'Креветки — йод для щитовидки. Если мёрзнешь постоянно — это оно. Омлет — как обычно.',
                'Хек с гречкой': 'Хек — нежная рыба, дешёвая. Гречка — наше всё. Сытно и без тяжести.',
                'Котлеты из минтая': 'Рыбные котлеты — это вкусно. Минтай дешёвый, а пользы как от дорогой рыбы.',
                'Салат с фасолью': 'Фасоль из банки — готовый белок. С яйцом — полноценный обед за 2 минуты.',
                'Скумбрия с картофелем': 'Скумбрия жирная и полезная. Картошка в мундире — чтобы не разваривалась. Капуста для хруста.',
                'Паровой омлет': 'На пару — самый полезный способ. Без масла, без гари. Чистый белок.',
                'Уха с пшеном': 'Уха из консервов — быстро. Пшено — наша крупа, не модная, но полезная. Согревает.',
                'Творог с чесноком': 'Чеснок — природный антибиотик. Творог — белок. Вместе — необычно, но вкусно.',
                'Сырники без муки': 'Сырники из одного творога и яйца. Без муки, без сахара. Чистый белок.',
                'Перловка с хеком': 'Перловка — армейская каша, даёт силу. Хек — нежирная рыба. Сытно надолго.',
                'Запечённая форель': 'Форель — праздничная рыба. Жирная, полезная для сердца и мозга. Если бюджет позволяет.',
                'Яйца + банан': 'Яйца и банан — быстрый завтрак. Калий и белок. Всё, что надо с утра.',
                'Паста с тунцом': 'Макароны можно, если из твёрдой пшеницы. Тунец — готовая начинка. Оливковое масло — полезный жир.',
                'Яичница с говяжьим фаршем': 'Мясо с утра — мужская еда. Цинк и креатин — для силы и выносливости.',
                'Тефтели с гречкой': 'Тефтели — наше, родное. Гречка — на гарнир. Как у бабушки, только без жира.',

                            { type: 'Ужин', title: 'Ряженка', ingredients: '250 мл ряженки', tags: ['На ночь'] }
                        ]}
                    ]
                }],
                notes: {
                    1: 'Пейте воду с лимоном по утрам. Кофе — без сахара, через полчаса после завтрака.',
                    2: 'Пейте воду с лимоном по утрам. Кофе — без сахара, через полчаса после завтрака.',
                    3: 'Пейте воду с лимоном по утрам. Кофе — без сахара, через полчаса после завтрака.',
                    4: 'Пейте воду с лимоном по утрам. Кофе — без сахара, через полчаса после завтрака.'
                }
            };

            let currentWeek = 1;
            let openDayIndex = null;
            let isTransitioning = false;
            const weekSelector = document.getElementById('weekSelector');
            const scrollIndicator = document.getElementById('scrollIndicator');
            const mainContent = document.getElementById('mainContent');
            const fabBtn = document.getElementById('fabBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalSheet = document.getElementById('modalSheet');
            const shoppingContent = document.getElementById('shoppingContent');

            function updateScrollIndicator() {
                const dots = scrollIndicator.querySelectorAll('.scroll-dot');
                dots.forEach((dot, i) => { dot.classList.toggle('active', i + 1 === currentWeek); });
            }

            function renderWeekSelector() {
                weekSelector.innerHTML = programData.weeks.map(w => `
                    <button class="week-btn ${w.id === currentWeek ? 'active' : ''}" data-week="${w.id}">${w.title}: ${w.subtitle}</button>
                `).join('');
                scrollIndicator.innerHTML = programData.weeks.map(() => '<span class="scroll-dot"></span>').join('');
                updateScrollIndicator();
                weekSelector.querySelectorAll('.week-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (isTransitioning) return;
                        const weekId = parseInt(btn.dataset.week);
                        if (weekId !== currentWeek) {
                            switchWeek(weekId, weekId > currentWeek ? 1 : -1);
                        }
                    });
                });
                const activeBtn = weekSelector.querySelector('.week-btn.active');
                if (activeBtn && window.innerWidth < 600) {
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }

            function getMealDetailHTML(title) {
                const detail = mealDetailsDB[title];
                const simple = mealSimpleExplanations[title] || '';
                let html = '';
                if (simple) html += `<div class="meal-why">${simple}</div>`;
                if (detail) html += `
                    <button class="meal-detail-btn" data-meal-title="${title}">Что внутри и зачем <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
                    <div class="meal-detail-panel"><div class="meal-detail-content">
                        <strong>Микроэлементы:</strong>
                        <div class="micro-list">${detail.micro.map(m => `<span class="micro-item">${m}</span>`).join('')}</div>
                        <strong>Подробнее:</strong> ${detail.benefit}
                    </div></div>
                `;
                return html;
            }

            function buildWeekHTML(weekId) {
                const week = programData.weeks.find(w => w.id === weekId);
                if (!week) return '';
                let html = '';
                week.days.forEach((day, index) => {
                    html += `
                        <div class="day-card" data-day-index="${index}">
                            <div class="day-header"><span class="day-name">${day.day}</span><svg class="day-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
                            <div class="day-body"><div class="day-body-inner">
                                ${day.meals.map(meal => `
                                    <div class="meal">
                                        <div class="meal-type">${meal.type}</div>
                                        <div class="meal-title">${meal.title}</div>
                                        <div class="meal-ingredients">${meal.ingredients}</div>
                                        ${meal.tags ? `<div class="meal-tags-row">${meal.tags.map(t => `<span class="meal-tag">${t}</span>`).join('')}</div>` : ''}
                                        ${getMealDetailHTML(meal.title)}
                                    </div>
                                `).join('')}
                            </div></div>
                        </div>`;
                });
                if (programData.notes[weekId]) html +=
                    `<div class="note-banner">${programData.notes[weekId]}</div>`;
                return html;
            }

            function bindMealEvents(container) {
                if (!container) return;
                container.querySelectorAll('.day-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const card = header.closest('.day-card');
                        toggleDay(parseInt(card.dataset.dayIndex));
                    });
                });
                container.querySelectorAll('.meal-detail-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const panel = btn.nextElementSibling;
                        const isOpen = panel.classList.contains('open');
                        if (isOpen) {
                            panel.classList.remove('open');
                            panel.style.maxHeight = '0';
                            btn.classList.remove('expanded');
                        } else {
                            panel.classList.add('open');
                            panel.style.maxHeight = panel.scrollHeight + 50 + 'px';
                            btn.classList.add('expanded');
                            const items = panel.querySelectorAll('.micro-item');
                            gsap.fromTo(items, { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3,
                                stagger: 0.04, ease: 'back.out(1.5)' });
                        }
                    });
                });
            }

            function clearMainContent() {
                mainContent.querySelectorAll('.week-container').forEach(c => c.remove());
                openDayIndex = null;
            }

            function renderWeekDirect(weekId) {
                clearMainContent();
                const container = document.createElement('div');
                container.className = 'week-container';
                container.dataset.weekContainer = weekId;
                container.innerHTML = buildWeekHTML(weekId);
                mainContent.appendChild(container);
                bindMealEvents(container);
                currentWeek = weekId;
                renderWeekSelector();
            }

            function switchWeek(newWeekId, direction) {
                if (isTransitioning) return;
                isTransitioning = true;
                const oldContainer = mainContent.querySelector('.week-container');
                const newContainer = document.createElement('div');
                newContainer.className = 'week-container';
                newContainer.dataset.weekContainer = newWeekId;
                newContainer.innerHTML = buildWeekHTML(newWeekId);
                mainContent.appendChild(newContainer);
                bindMealEvents(newContainer);
                const moveX = direction * 80;
                gsap.set(newContainer, { x: moveX * 2, opacity: 0 });
                if (oldContainer) gsap.set(oldContainer, { x: 0, opacity: 1 });
                openDayIndex = null;
                const tl = gsap.timeline({
                    onComplete: () => {
                        if (oldContainer) oldContainer.remove();
                        currentWeek = newWeekId;
                        renderWeekSelector();
                        isTransitioning = false;
                    }
                });
                if (oldContainer) tl.to(oldContainer, { x: -moveX, opacity: 0, duration: 0.35,
                    ease: 'power2.inOut' }, 0);
                tl.to(newContainer, { x: 0, opacity: 1, duration: 0.35, ease: 'power2.inOut' }, 0);
            }

            function toggleDay(dayIndex) {
                const container = mainContent.querySelector('.week-container');
                if (!container) return;
                const targetCard = container.querySelector(`[data-day-index="${dayIndex}"]`);
                if (!targetCard) return;
                if (openDayIndex === dayIndex) {
                    openDayIndex = null;
                    targetCard.classList.remove('open');
                    targetCard.querySelector('.day-body').style.maxHeight = '0';
                } else {
                    if (openDayIndex !== null) {
                        const prevCard = container.querySelector(`[data-day-index="${openDayIndex}"]`);
                        if (prevCard) { prevCard.classList.remove('open');
                            prevCard.querySelector('.day-body').style.maxHeight = '0'; }
                    }
                    openDayIndex = dayIndex;
                    targetCard.classList.add('open');
                    const body = targetCard.querySelector('.day-body');
                    body.style.maxHeight = body.scrollHeight + 50 + 'px';
                    const meals = targetCard.querySelectorAll('.meal');
                    gsap.fromTo(meals, { opacity: 0, x: -15 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.06,
                        ease: 'power2.out' });
                }
            }

            function initSwipe() {
                Observer.create({
                    target: mainContent,
                    type: 'touch',
                    onRight: () => { if (!isTransitioning && currentWeek > 1) switchWeek(currentWeek - 1, -1); },
                    onLeft: () => { if (!isTransitioning && currentWeek < 4) switchWeek(currentWeek + 1, 1); },
                    tolerance: 80,
                });
            }

            function renderShoppingList() {
                const categories = {
                    'Крупы': ['Гречка', 'Рис белый', 'Рис бурый', 'Киноа', 'Чечевица', 'Овсяные хлопья', 'Макароны',
                        'Перловка', 'Пшено', 'Нут'],
                    'Консервы': ['Тунец', 'Горбуша', 'Печень трески', 'Фасоль', 'Томатная паста'],
                    'Масла': ['Сливочное', 'Топлёное (гхи)', 'Подсолнечное', 'Оливковое', 'Тыквенное', 'Льняное'],
                    'Орехи и семена': ['Семена льна', 'Тыквенные семечки', 'Грецкий орех', 'Чиа'],
                    'Специи': ['Куркума', 'Чёрный перец', 'Корица', 'Паприка', 'Соль'],
                    'Молочка': ['Творог 5%', 'Кефир', 'Ряженка', 'Мацони', 'Сметана', 'Сыр'],
                    'Мясо и птица': ['Куриные бёдра', 'Куриное филе', 'Фарш куриный', 'Говяжий фарш', 'Говядина',
                        'Печень говяжья', 'Язык', 'Баранина'],
                    'Рыба': ['Минтай', 'Хек', 'Скумбрия', 'Форель', 'Креветки'],
                    'Овощи и фрукты': ['Яблоки', 'Бананы', 'Апельсины', 'Авокадо', 'Помидоры', 'Огурцы', 'Морковь',
                        'Свёкла', 'Капуста', 'Квашеная капуста', 'Цветная капуста', 'Брокколи', 'Фасоль стручковая',
                        'Шампиньоны', 'Лук', 'Чеснок', 'Зелень', 'Сельдерей', 'Руккола'],
                    'Яйца и хлеб': ['Яйца (3-4 десятка)', 'Хлеб цельнозерновой', 'Хлеб бородинский']
                };
                let html = '';
                for (const [cat, items] of Object.entries(categories)) html +=
                    `<div class="shopping-category"><h4>${cat}</h4><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
                shoppingContent.innerHTML = html;
            }

            function openModal() { modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden'; }

            function closeModal() { modalOverlay.classList.remove('open');
                document.body.style.overflow = ''; }
            fabBtn.addEventListener('click', openModal);
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
            let touchStartY = 0;
            modalSheet.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
            modalSheet.addEventListener('touchmove', (e) => { if (e.touches[0].clientY - touchStartY > 60 && modalSheet
                    .scrollTop <= 0) closeModal(); }, { passive: true });

            function init() {
                clearMainContent();
                renderWeekDirect(currentWeek);
                renderShoppingList();
                initSwipe();
                gsap.fromTo('.header', { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power3.out',
                    delay: 0.1 });
                gsap.fromTo('.week-btn', { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.05,
                    ease: 'power2.out', delay: 0.2 });
                gsap.fromTo('.day-card', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.06,
                    ease: 'power2.out', delay: 0.4 });
                gsap.fromTo('.fab', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: 'back.out(1.7)',
                    delay: 0.8 });
            }
            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
